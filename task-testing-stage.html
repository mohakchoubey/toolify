
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper List + Tasks · Firebase Real-time</title>
<style>
:root {
  --paper: #fffdf4;
  --ink: #243047;
  --muted: #697386;
  --line: #dbe6f2;
  --margin: #ef9a9a;
  --accent: #3867a8;
  --danger: #ef5350;
  --success: #66bb6a;
  --fs: 17px;
  --radius: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px 12px 45px;
  background: #e8edf3;
  color: var(--ink);
  font: 15px "Segoe UI", Arial, sans-serif;
}
body.dark {
  --paper: #202631;
  --ink: #edf1f7;
  --muted: #aab4c3;
  --line: #3a4658;
  --margin: #8d515b;
  --accent: #8db9ff;
  background: #121720;
}
.app { max-width: 900px; margin: auto; }
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.brand {
  font-size: 12px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--muted);
}
.tabs {
  display: flex;
  gap: 4px;
  align-items: center;
}
.tab-btn {
  font: inherit;
  border: 2px solid transparent;
  border-radius: var(--radius);
  padding: 8px 14px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: all 0.2s;
}
.tab-btn.active {
  border-bottom-color: var(--accent);
  color: var(--accent);
}
.tab-btn:hover {
  color: var(--ink);
}
.controls {
  display: flex;
  gap: 8px;
  align-items: center;
}
button, select, .filelabel, input[type="text"], input[type="email"] {
  font: inherit;
  border: 1px solid #c7d0dd;
  border-radius: var(--radius);
  padding: 8px 10px;
  background: #fff;
  color: #26344a;
  cursor: pointer;
}
body.dark button, body.dark select, body.dark input, body.dark .filelabel {
  background: #2b3442;
  color: var(--ink);
  border-color: #4b586b;
}
button:hover, .filelabel:hover {
  filter: brightness(0.96);
}
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.btn-primary {
  background: var(--accent) !important;
  color: white !important;
  border-color: var(--accent) !important;
  font-weight: 700;
}
.btn-primary:hover {
  filter: brightness(1.1);
}
.btn-danger {
  background: var(--danger) !important;
  color: white !important;
  border-color: var(--danger) !important;
}
.btn-small {
  font-size: 11px;
  padding: 5px 8px;
}
.gear { font-size: 13px; font-weight: 700; }
.panel {
  background: var(--paper);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 4px 12px rgba(29, 43, 59, 0.13);
  display: none;
}
.panel.active { display: block; }
.paper {
  position: relative;
  overflow: hidden;
  min-height: 600px;
  padding: 38px 34px 35px 74px;
  border-radius: 5px;
  background-color: var(--paper);
  color: var(--ink);
  box-shadow: 0 12px 35px #1d2b3b22;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 31px,
    var(--line) 32px,
    transparent 33px
  );
}
.paper:before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 52px;
  width: 2px;
  background: var(--margin);
  opacity: 0.75;
}
.paper:after {
  content: "";
  position: absolute;
  left: 16px;
  top: 18px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #e8edf3;
  box-shadow: 0 0 0 1px #b8c2ce;
}
body.dark .paper:after { background: #121720; }

.head {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 14px;
}
.title {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: 700 28px Georgia, serif;
  padding: 0 0 5px;
}
.subtitle {
  color: var(--muted);
  font-size: 12px;
}
.count {
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 7px 9px;
  font-size: 12px;
  color: var(--muted);
  background: var(--paper);
}
.progress {
  height: 5px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin: 13px 0 18px;
}
.progress div {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.2s;
}
.add {
  display: flex;
  gap: 8px;
  position: relative;
  z-index: 2;
  margin-bottom: 11px;
}
.add input {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
}
.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
  position: relative;
  z-index: 2;
  margin-bottom: 12px;
}
.tools select, .tools button, .filelabel {
  font-size: 12px;
  padding: 8px 9px;
}
.items, .tasks-list {
  position: relative;
  z-index: 1;
  padding: 0;
  margin: 0;
  list-style: none;
  font-size: var(--fs);
}
.item, .task-item {
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 4px;
  animation: slideIn 0.35s ease both;
  border-radius: var(--radius);
  transition: background 0.2s;
}
.item:hover, .task-item:hover {
  background: rgba(0, 0, 0, 0.04);
}
body.dark .item:hover, body.dark .task-item:hover {
  background: rgba(255, 255, 255, 0.06);
}
@keyframes slideIn {
  0% { opacity: 0; transform: translateX(-9px); }
  65% { opacity: 1; transform: translateX(2px); }
  100% { opacity: 1; transform: none; }
}
.mark {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  cursor: pointer;
}
.bullet {
  min-width: 19px;
  text-align: center;
  color: var(--accent);
  flex-shrink: 0;
}
.itemtext, .task-text {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  line-height: 1.55;
  white-space: pre-wrap;
  cursor: text;
}
.done .itemtext { text-decoration: line-through; opacity: 0.52; }
.task-item.done .task-text { text-decoration: line-through; opacity: 0.52; }
.task-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.task-due {
  padding: 2px 6px;
  background: rgba(56, 103, 168, 0.1);
  border-radius: 4px;
  color: var(--accent);
}
.task-due.overdue {
  background: rgba(239, 83, 80, 0.1);
  color: var(--danger);
}
.task-list-item {
  padding: 10px 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 8px;
}
.task-list-item:hover {
  border-color: var(--accent);
  background: rgba(56, 103, 168, 0.05);
}
.task-list-item.active {
  border-color: var(--accent);
  background: rgba(56, 103, 168, 0.1);
  font-weight: 600;
}
.task-list-count {
  font-size: 12px;
  color: var(--muted);
  background: var(--line);
  padding: 2px 6px;
  border-radius: 4px;
}
.actions {
  display: flex;
  gap: 4px;
}
.actions button {
  padding: 3px 6px;
  font-size: 11px;
}
.empty {
  color: var(--muted);
  font-size: 14px;
  padding: 12px 0;
}
.settings {
  display: none;
  position: relative;
  z-index: 3;
  margin-bottom: 15px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}
.settings.open { display: block; animation: fade 0.18s ease; }
@keyframes fade {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}
.settings h2 {
  font-size: 15px;
  margin: 0 0 12px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.setting {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: var(--muted);
}
.setting input, .setting select {
  width: 100%;
  min-width: 0;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
}
.setting input[type="color"] {
  height: 36px;
  padding: 3px;
}
.setting input[type="range"] { padding: 0; }
.wide { grid-column: 1 / -1; }
.status {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--muted);
  color: white;
  padding: 8px 12px;
  border-radius: var(--radius);
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 40;
}
.status.online { opacity: 1; background: var(--success); }
.toast {
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  background: #26344a;
  color: #fff;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 50;
}
.toast.show { opacity: 1; }
.hidden { display: none !important; }
.pencil {
  position: fixed;
  z-index: 20;
  width: 18px;
  height: 110px;
  pointer-events: none;
  opacity: 0;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%) rotate(45deg);
}
.pencil.active { animation: pencil 0.8s ease-in-out; }
.pbody {
  position: absolute;
  bottom: 10px;
  left: 3px;
  width: 12px;
  height: 88px;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(90deg, #d7a63f, #ffdb74, #c68c2c);
  border: 1px solid #a97a25;
}
.peraser {
  position: absolute;
  bottom: 96px;
  left: 3px;
  width: 12px;
  height: 12px;
  border-radius: 4px 4px 1px 1px;
  background: #e88991;
}
.pwood {
  position: absolute;
  bottom: 0;
  left: 5px;
  width: 8px;
  height: 12px;
  background: #e6c18d;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
@keyframes pencil {
  0% { opacity: 0; left: 70%; top: 30%; }
  15% { opacity: 1; }
  55% { left: 55%; top: 52%; transform: translate(-50%, -50%) rotate(30deg); }
  85% { opacity: 1; }
  100% { opacity: 0; left: 40%; top: 68%; transform: translate(-50%, -50%) rotate(45deg); }
}

@media (max-width: 600px) {
  body { padding: 10px 7px 25px; }
  .paper { padding: 28px 12px 28px 44px; min-height: 500px; }
  .paper:before { left: 31px; }
  .paper:after { left: 9px; width: 11px; height: 11px; }
  .title { font-size: 22px; }
  .header { flex-direction: column; align-items: flex-start; }
  .controls { flex-direction: column; width: 100%; }
  .controls button { width: 100%; }
}
@media print {
  body { background: white; padding: 0; }
  .header, .add, .tools, .settings, .actions, .status, .pencil { display: none !important; }
  .paper { box-shadow: none; border-radius: 0; min-height: 100vh; }
  .item .mark { appearance: none; border: 1px solid #555; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">📝 Paper List + Tasks</div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="list">📋 Lists</button>
      <button class="tab-btn" data-tab="tasks">✓ Tasks</button>
    </div>
    <div class="controls">
      <button id="customize" class="gear" aria-expanded="false">⚙ Settings</button>
      <select id="theme" style="font-size: 12px;">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </div>

  <!-- PAPER LIST PANEL -->
  <div id="list-panel" class="panel active">
    <main class="paper">
      <div class="head">
        <div style="flex: 1; min-width: 0;">
          <input id="title" class="title" maxlength="80" value="My Packing List" aria-label="List title">
          <div class="subtitle" id="subtitle">A little page for everything to remember</div>
        </div>
        <div id="count" class="count">0 / 0 done</div>
      </div>
      <div class="progress"><div id="bar"></div></div>

      <section id="settings" class="settings">
        <h2>List Customization</h2>
        <div class="grid">
          <label class="setting">List marker
            <select id="marker">
              <option value="check">Tick box</option>
              <option value="bullet">Bullet •</option>
              <option value="circle">Circle ○</option>
              <option value="number">Numbered</option>
              <option value="dash">Dash —</option>
              <option value="square">Square ▫</option>
            </select>
          </label>
          <label class="setting">Text color
            <input id="textColor" type="color" value="#243047">
          </label>
          <label class="setting">Accent color
            <input id="accent" type="color" value="#3867a8">
          </label>
          <label class="setting">Sort list
            <select id="sort">
              <option value="default">Default (manual)</option>
              <option value="az">A to Z</option>
              <option value="za">Z to A</option>
              <option value="unchecked">Unchecked first</option>
              <option value="checked">Checked first</option>
              <option value="newest">Newest first</option>
            </select>
          </label>
          <label class="setting">Font style
            <select id="font">
              <option value="system">Clean sans</option>
              <option value="serif">Notebook serif</option>
              <option value="mono">Typewriter</option>
            </select>
          </label>
          <label class="setting wide">Text size: <span id="sizeLabel">17px</span>
            <input id="size" type="range" min="12" max="28" value="17">
          </label>
          <div class="setting wide">
            <button id="reset" type="button">Reset appearance</button>
          </div>
        </div>
      </section>

      <form id="addForm" class="add">
        <input id="newItem" maxlength="300" placeholder="Write a new item…" aria-label="New list item" autocomplete="off">
        <button class="btn-primary" type="submit">＋ Add</button>
      </form>

      <div class="tools">
        <select id="sortQuick" aria-label="Sort items">
          <option value="default">Default order</option>
          <option value="az">A to Z</option>
          <option value="za">Z to A</option>
          <option value="unchecked">Unchecked first</option>
          <option value="checked">Checked first</option>
          <option value="newest">Newest first</option>
        </select>
        <button id="export" type="button">⬇ Export</button>
        <label class="filelabel" for="import">⬆ Import</label>
        <input id="import" class="hidden" type="file" accept=".json,.txt,.csv,application/json,text/plain,text/csv">
        <button id="clearChecked" type="button">Clear checked</button>
        <button id="print" type="button">Print / PDF</button>
      </div>

      <ul id="items" class="items" aria-label="Your list"></ul>
      <div id="empty" class="empty">Your page is ready. Add your first item above.</div>
    </main>
  </div>

  <!-- GOOGLE TASKS PANEL -->
  <div id="tasks-panel" class="panel">
    <div style="display: grid; grid-template-columns: 280px 1fr; gap: 16px; min-height: 600px;">
      <!-- Task Lists Sidebar -->
      <div style="background: var(--paper); padding: 16px; border-radius: var(--radius); height: fit-content;">
        <h3 style="margin: 0 0 12px; font-size: 14px; color: var(--muted);">📑 Task Lists</h3>
        <div id="taskLists" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;"></div>
        <form id="addListForm" style="display: flex; gap: 6px;">
          <input id="newListName" type="text" placeholder="New list…" maxlength="50" style="flex: 1;">
          <button class="btn-primary btn-small" type="submit">+</button>
        </form>
      </div>


      <!-- Tasks Panel -->
      <div style="background: var(--paper); padding: 16px; border-radius: var(--radius);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div>
            <h2 id="activeListTitle" style="margin: 0; font-size: 20px;">My Tasks</h2>
            <div id="taskCount" class="subtitle" style="margin-top: 4px;"></div>
          </div>
          <div style="display: flex; gap: 6px;">
            <button id="deleteList" class="btn-danger btn-small" title="Delete this list">🗑</button>
          </div>
        </div>

        <form id="addTaskForm" style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input id="newTask" type="text" placeholder="Add a new task…" maxlength="200" style="flex: 1;">
          <input id="taskDue" type="date" style="max-width: 120px;">
          <button class="btn-primary btn-small" type="submit">Add</button>
        </form>

        <ul id="tasksList" class="tasks-list"></ul>
        <div id="tasksEmpty" class="empty" style="text-align: center;">Select a list or create one to get started.</div>
      </div>
    </div>
  </div>
</div>

<div id="pencil" class="pencil" aria-hidden="true">
  <div class="pwood"></div>
  <div class="pbody"></div>
  <div class="peraser"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="status" class="status">⚡ Syncing with Firebase...</div>

<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore.js"></script>

<script>
// ============================================================================
// FIREBASE CONFIGURATION — REPLACE WITH YOUR OWN CONFIG
// ============================================================================

  const firebaseConfig = { 
    apiKey: "AIzaSyAeHDhdiTRwftUGYgrb1m19v7hm2R5rb-Y", 
    authDomain: "toolbox-hub-98c03.firebaseapp.com", 
    projectId: "toolbox-hub-98c03", 
    storageBucket: "toolbox-hub-98c03.firebasestorage.app", 
    messagingSenderId: "321020105472", 
    appId: "1:321020105472:web:356e7c2903def7b9d859e5" 
  };
  

// Initialize Firebase
let db;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  console.log("✓ Firebase initialized");
} catch (e) {
  console.warn("⚠ Firebase config not set. Using localStorage only.", e.message);
}

// ============================================================================
// STATE & HELPERS
// ============================================================================
const $ = id => document.getElementById(id);
const KEY_LIST = 'my-paper-list-v1';
const KEY_TASKS = 'my-tasks-v1';

let listState = {
  items: [],
  nextId: 1,
  sortMode: 'default',
  title: 'My Packing List',
  theme: 'light',
  marker: 'check',
  textColor: '#243047',
  accent: '#3867a8',
  size: '17',
  font: 'system'
};

let tasksState = {
  lists: [],
  tasks: [],
  activeListId: null
};

const starterItems = [
  'Passport and travel documents',
  'Flight tickets / boarding pass',
  'Travel insurance details',
  'Wallet, cards and some cash',
  'Phone and charger',
  'Power adapter for Europe',
  'Headphones',
  'Daily medication (if needed)',
  'Toothbrush and toothpaste',
  'Skincare and toiletries',
  'Weather-appropriate clothes',
  'Comfortable walking shoes'
];

let toastTimer;

function note(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
}

function setStatus(isOnline) {
  const statusEl = $('status');
  if (isOnline) {
    statusEl.textContent = '✓ Firebase Synced';
    statusEl.classList.add('online');
    setTimeout(() => statusEl.classList.remove('online'), 2000);
  } else {
    statusEl.textContent = '⚠ Offline · Using Local';
    statusEl.classList.remove('online');
  }
}

function pencil() {
  let p = $('pencil');
  p.classList.remove('active');
  void p.offsetWidth;
  p.classList.add('active');
}

// ============================================================================
// STORAGE: LOCAL & FIREBASE
// ============================================================================
async function saveListLocal() {
  try {
    localStorage.setItem(KEY_LIST, JSON.stringify(listState));
  } catch (e) { console.error(e); }
}

async function loadListLocal() {
  try {
    let d = JSON.parse(localStorage.getItem(KEY_LIST));
    if (d && Array.isArray(d.items)) {
      listState = { ...listState, ...d };
      return true;
    }
  } catch (e) { }
  return false;
}

async function saveListFirebase() {
  if (!db) return;
  try {
    await db.collection('users').doc('anonymous').collection('lists').doc('main').set({
      title: listState.title,
      items: listState.items,
      nextId: listState.nextId,
      sortMode: listState.sortMode,
      theme: listState.theme,
      marker: listState.marker,
      textColor: listState.textColor,
      accent: listState.accent,
      size: listState.size,
      font: listState.font,
      updatedAt: new Date()
    });
    setStatus(true);
  } catch (e) {
    console.error('Firebase save failed:', e);
  }
}

async function loadListFirebase() {
  if (!db) return false;
  try {
    let doc = await db.collection('users').doc('anonymous').collection('lists').doc('main').get();
    if (doc.exists) {
      let d = doc.data();
      listState = { ...listState, ...d };
      return true;
    }
  } catch (e) {
    console.error('Firebase load failed:', e);
  }
  return false;
}

async function saveTasksFirebase() {
  if (!db) return;
  try {
    let batch = db.batch();
    tasksState.lists.forEach(list => {
      let docRef = db.collection('users').doc('anonymous').collection('task_lists').doc(list.id);
      batch.set(docRef, list);
    });
    tasksState.tasks.forEach(task => {
      let docRef = db.collection('users').doc('anonymous').collection('tasks').doc(task.id);
      batch.set(docRef, task);
    });
    await batch.commit();
    setStatus(true);
  } catch (e) {
    console.error('Tasks Firebase save failed:', e);
  }
}

// ============================================================================
// LIST RENDERING
// ============================================================================
function sorted() {
  let a = [...listState.items];
  if (listState.sortMode === 'az') {
    a.sort((x, y) => x.text.localeCompare(y.text, undefined, { sensitivity: 'base' }));
  } else if (listState.sortMode === 'za') {
    a.sort((x, y) => y.text.localeCompare(x.text, undefined, { sensitivity: 'base' }));
  } else if (listState.sortMode === 'unchecked') {
    a.sort((x, y) => +x.done - +y.done || x.created - y.created);
  } else if (listState.sortMode === 'checked') {
    a.sort((x, y) => +y.done - +x.done || x.created - y.created);
  } else if (listState.sortMode === 'newest') {
    a.sort((x, y) => y.created - x.created);
  }
  return a;
}

function editItem(li, it, el) {
  if (li.querySelector('.editInput')) return;
  let inp = document.createElement('input');
  inp.className = 'editInput';
  inp.value = it.text;
  inp.maxLength = 300;
  inp.style.cssText = 'flex:1;min-width:0;padding:5px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--paper);color:var(--ink);font:inherit';
  el.replaceWith(inp);
  inp.focus();
  inp.select();
  let finished = false;
  function finish(commit) {
    if (finished) return;
    finished = true;
    let v = inp.value.trim();
    if (commit && v) {
      it.text = v;
      pencil();
    }
    renderList();
  }
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') finish(false);
  });
  inp.addEventListener('blur', () => finish(true));
}

function renderList() {
  let ul = $('items');
  ul.replaceChildren();
  let a = sorted();
  let mode = listState.marker;
  a.forEach((it, i) => {
    let li = document.createElement('li');
    li.className = 'item' + (it.done ? ' done' : '');
    li.dataset.id = it.id;
    if (mode !== 'check') {
      let b = document.createElement('span');
      b.className = 'bullet';
      b.textContent = mode === 'bullet' ? '•' : mode === 'circle' ? (it.done ? '◉' : '○') : mode === 'number' ? (i + 1) + '.' : mode === 'dash' ? '—' : (it.done ? '▪' : '▫');
      li.append(b);
    }
    let cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'mark';
    cb.checked = it.done;
    cb.addEventListener('change', () => {
      it.done = cb.checked;
      renderList();
      saveListLocal();
      saveListFirebase();
    });
    li.append(cb);
    let txt = document.createElement('span');
    txt.className = 'itemtext';
    txt.textContent = it.text;
    txt.title = 'Click to edit';
    txt.tabIndex = 0;
    txt.addEventListener('click', () => editItem(li, it, txt));
    txt.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); editItem(li, it, txt); }
    });
    li.append(txt);
    let acts = document.createElement('div');
    acts.className = 'actions';
    let eb = document.createElement('button');
    eb.type = 'button';
    eb.className = 'btn-small';
    eb.textContent = 'Edit';
    eb.onclick = () => editItem(li, it, txt);
    let db = document.createElement('button');
    db.type = 'button';
    db.className = 'btn-small btn-danger';
    db.textContent = 'Delete';
    db.onclick = () => {
      listState.items = listState.items.filter(x => x.id !== it.id);
      renderList();
      saveListLocal();
      saveListFirebase();
      note('Item deleted');
    };
    acts.append(eb, db);
    li.append(acts);
    ul.append(li);
  });
  let done = listState.items.filter(x => x.done).length;
  $('count').textContent = `${done} / ${listState.items.length} done`;
  $('bar').style.width = listState.items.length ? (done / listState.items.length * 100) + '%' : '0%';
  $('empty').classList.toggle('hidden', listState.items.length > 0);
  $('subtitle').textContent = listState.items.length ? 'Write it down. Tick it off. Keep moving.' : 'A little page for everything to remember';
  saveListLocal();
}

function applyAppearance() {
  document.body.classList.toggle('dark', listState.theme === 'dark');
  document.documentElement.style.setProperty('--ink', listState.textColor);
  document.documentElement.style.setProperty('--accent', listState.accent);
  document.documentElement.style.setProperty('--fs', listState.size + 'px');
  $('sizeLabel').textContent = listState.size + 'px';
  let f = listState.font;
  $('items').style.fontFamily = f === 'serif' ? 'Georgia, "Times New Roman", serif' : f === 'mono' ? '"Courier New", monospace' : '"Segoe UI", Arial, sans-serif';
  renderList();
}

// ============================================================================
// TASKS RENDERING
// ============================================================================
function renderTaskLists() {
  let container = $('taskLists');
  container.replaceChildren();
  if (tasksState.lists.length === 0) {
    container.innerHTML = '<div class="empty" style="font-size: 12px;">No lists yet</div>';
    return;
  }
  tasksState.lists.forEach(list => {
    let taskCount = tasksState.tasks.filter(t => t.listId === list.id && !t.done).length;
    let div = document.createElement('div');
    div.className = 'task-list-item' + (tasksState.activeListId === list.id ? ' active' : '');
    div.innerHTML = `
      <span>${list.name}</span>
      <span class="task-list-count">${taskCount}</span>
    `;
    div.onclick = () => selectTaskList(list.id);
    container.append(div);
  });
}

function renderTasks() {
  if (!tasksState.activeListId) {
    $('tasksEmpty').classList.remove('hidden');
    $('tasksList').replaceChildren();
    $('activeListTitle').textContent = 'My Tasks';
    $('taskCount').textContent = '';
    $('deleteList').disabled = true;
    return;
  }
  let list = tasksState.lists.find(l => l.id === tasksState.activeListId);
  if (!list) return;
  $('activeListTitle').textContent = list.name;
  let tasks = tasksState.tasks.filter(t => t.listId === tasksState.activeListId).sort((a, b) => a.created - b.created);
  let done = tasks.filter(t => t.done).length;
  $('taskCount').textContent = `${done} / ${tasks.length} done`;
  let ul = $('tasksList');
  ul.replaceChildren();
  $('tasksEmpty').classList.toggle('hidden', tasks.length > 0);
  tasks.forEach(task => {
    let li = document.createElement('li');
    li.className = 'task-item' + (task.done ? ' done' : '');
    li.dataset.id = task.id;
    let cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'mark';
    cb.checked = task.done;
    cb.addEventListener('change', () => {
      task.done = cb.checked;
      renderTasks();
      renderTaskLists();
      saveTasksFirebase();
    });
    li.append(cb);
    let txt = document.createElement('span');
    txt.className = 'task-text';
    txt.textContent = task.text;
    li.append(txt);
    if (task.due) {
      let meta = document.createElement('div');
      meta.className = 'task-meta';
      let dueEl = document.createElement('span');
      dueEl.className = 'task-due';
      let dueDate = new Date(task.due);
      let isOverdue = dueDate < new Date() && !task.done;
      if (isOverdue) dueEl.classList.add('overdue');
      dueEl.textContent = dueDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      meta.append(dueEl);
      li.append(meta);
    }
    let acts = document.createElement('div');
    acts.className = 'actions';
    let db = document.createElement('button');
    db.type = 'button';
    db.className = 'btn-small btn-danger';
    db.textContent = 'Delete';
    db.onclick = () => {
      tasksState.tasks = tasksState.tasks.filter(t => t.id !== task.id);
      renderTasks();
      renderTaskLists();
      saveTasksFirebase();
      note('Task deleted');
    };
    acts.append(db);
    li.append(acts);
    ul.append(li);
  });
}

function selectTaskList(listId) {
  tasksState.activeListId = listId;
  renderTaskLists();
  renderTasks();
}

// ============================================================================
// EVENT LISTENERS - LIST
// ============================================================================
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  let v = $('newItem').value.trim();
  if (!v) { $('newItem').focus(); return; }
  listState.items.push({
    id: listState.nextId++,
    text: v,
    done: false,
    created: Date.now()
  });
  $('newItem').value = '';
  renderList();
  pencil();
  $('newItem').focus();
  saveListLocal();
  saveListFirebase();
});

$('customize').onclick = () => {
  let open = $('settings').classList.toggle('open');
  $('customize').setAttribute('aria-expanded', String(open));
};

['marker', 'textColor', 'accent', 'size', 'font', 'sort'].forEach(id => {
  $(id).addEventListener('input', () => {
    listState[id === 'textColor' ? 'textColor' : id === 'accent' ? 'accent' : id] = $(id).value;
    applyAppearance();
    saveListLocal();
    saveListFirebase();
  });
});

$('sortQuick').onchange = e => {
  listState.sortMode = e.target.value;
  $('sort').value = e.target.value;
  renderList();
  saveListLocal();
  saveListFirebase();
};

$('sort').onchange = e => {
  listState.sortMode = e.target.value;
  $('sortQuick').value = e.target.value;
  renderList();
  saveListLocal();
  saveListFirebase();
};

$('theme').addEventListener('change', e => {
  listState.theme = e.target.value;
  applyAppearance();
  saveListLocal();
  saveListFirebase();
});

$('title').addEventListener('input', () => {
  listState.title = $('title').value;
  saveListLocal();
  saveListFirebase();
});

$('reset').onclick = () => {
  listState.marker = 'check';
  listState.textColor = '#243047';
  listState.accent = '#3867a8';
  listState.size = '17';
  listState.font = 'system';
  $('marker').value = 'check';
  $('textColor').value = '#243047';
  $('accent').value = '#3867a8';
  $('size').value = '17';
  $('font').value = 'system';
  applyAppearance();
  note('Appearance reset');
};

$('clearChecked').onclick = () => {
  let n = listState.items.filter(x => x.done).length;
  if (!n) return note('No checked items');
  if (confirm(`Remove ${n} checked item(s)?`)) {
    listState.items = listState.items.filter(x => !x.done);
    renderList();
    saveListLocal();
    saveListFirebase();
    note('Checked items cleared');
  }
};

$('export').onclick = () => {
  let data = {
    title: listState.title,
    exportedAt: new Date().toISOString(),
    items: listState.items.map(x => ({ text: x.text, done: x.done, created: x.created }))
  };
  let blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = ((listState.title || 'my-list').replace(/[^a-z0-9-_]+/gi, '-').replace(/^-|-$/g, '') || 'my-list') + '.json';
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  note('List exported');
};

$('import').addEventListener('change', async e => {
  let file = e.target.files?.[0];
  if (!file) return;
  try {
    let c = await file.text();
    let arr;
    if (file.name.toLowerCase().endsWith('.json')) {
      let d = JSON.parse(c);
      arr = Array.isArray(d) ? d : d.items;
      if (!Array.isArray(arr)) throw Error();
      if (!Array.isArray(d) && d.title) listState.title = String(d.title).slice(0, 80);
      arr = arr.map(x => typeof x === 'string' ? { text: x, done: false } : { text: String(x.text ?? x.name ?? ''), done: !!x.done }).filter(x => x.text.trim());
    } else {
      arr = c.split(/\r?\n/).map(s => s.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(Boolean).map(text => ({ text, done: false }));
    }
    if (!arr.length) throw Error();
    let replace = listState.items.length && !confirm(`Import ${arr.length} item(s)? OK = add | Cancel = replace`);
    if (replace) listState.items = [];
    listState.items.push(...arr.map(x => ({ id: listState.nextId++, text: x.text, done: !!x.done, created: Date.now() + listState.nextId })));
    renderList();
    saveListLocal();
    saveListFirebase();
    note(`${arr.length} item(s) imported`);
  } catch (err) {
    alert('Import failed. Use JSON export or TXT/CSV with one item per line.');
  }
  e.target.value = '';
});

$('print').onclick = () => window.print();

// ============================================================================
// EVENT LISTENERS - TASKS
// ============================================================================
$('addListForm').addEventListener('submit', e => {
  e.preventDefault();
  let name = $('newListName').value.trim();
  if (!name) return;
  let list = { id: 'list-' + Date.now(), name, created: Date.now() };
  tasksState.lists.push(list);
  tasksState.activeListId = list.id;
  $('newListName').value = '';
  renderTaskLists();
  renderTasks();
  saveTasksFirebase();
});

$('addTaskForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!tasksState.activeListId) return note('Select a list first');
  let text = $('newTask').value.trim();
  if (!text) return;
  let task = {
    id: 'task-' + Date.now(),
    listId: tasksState.activeListId,
    text,
    due: $('taskDue').value || null,
    done: false,
    created: Date.now()
  };
  tasksState.tasks.push(task);
  $('newTask').value = '';
  $('taskDue').value = '';
  renderTasks();
  renderTaskLists();
  saveTasksFirebase();
});

$('deleteList').onclick = () => {
  if (!tasksState.activeListId) return;
  if (!confirm('Delete this list and all its tasks?')) return;
  tasksState.lists = tasksState.lists.filter(l => l.id !== tasksState.activeListId);
  tasksState.tasks = tasksState.tasks.filter(t => t.listId !== tasksState.activeListId);
  tasksState.activeListId = tasksState.lists[0]?.id || null;
  renderTaskLists();
  renderTasks();
  saveTasksFirebase();
  note('List deleted');
};

// ============================================================================
// TAB NAVIGATION
// ============================================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    let tab = btn.dataset.tab;
    if (tab === 'list') {
      $('list-panel').classList.add('active');
    } else {
      $('tasks-panel').classList.add('active');
    }
  });
});

// ============================================================================
// INITIALIZATION
// ============================================================================
async function init() {
  // Load list data
  let hasLocal = await loadListLocal();
  if (db) {
    try {
      await loadListFirebase();
      note('✓ Loaded from Firebase');
    } catch (e) {
      if (!hasLocal) {
        listState.items = starterItems.map(text => ({
          id: listState.nextId++,
          text,
          done: false,
          created: Date.now() + listState.nextId
        }));
        await saveListFirebase();
      }
    }
  } else {
    if (!hasLocal) {
      listState.items = starterItems.map(text => ({
        id: listState.nextId++,
        text,
        done: false,
        created: Date.now() + listState.nextId
      }));
    }
  }

  // Apply settings
  $('title').value = listState.title;
  $('theme').value = listState.theme;
  $('marker').value = listState.marker;
  $('textColor').value = listState.textColor;
  $('accent').value = listState.accent;
  $('size').value = listState.size;
  $('font').value = listState.font;
  $('sort').value = $('sortQuick').value = listState.sortMode;

  applyAppearance();
  renderTaskLists();
  renderTasks();

  // If no tasks yet, create a default list
  if (tasksState.lists.length === 0) {
    let defaultList = { id: 'list-' + Date.now(), name: 'My Tasks', created: Date.now() };
    tasksState.lists.push(defaultList);
    tasksState.activeListId = defaultList.id;
    renderTaskLists();
    renderTasks();
    await saveTasksFirebase();
  }

  setStatus(!!db);
}

init().catch(console.error);
</script>
</body>
</html>
