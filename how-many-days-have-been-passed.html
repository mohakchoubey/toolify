function shell(page){
document.body.innerHTML=`<div class="page"><header class="top"><div class="in"><a class="brand" href="${BASE}" style="display:flex;align-items:center;gap:.55rem"><img src="${BASE}favicon.png" alt="" style="width:2rem;height:2rem;border-radius:50%" onerror="this.outerHTML='<span class=lgc>✓</span>'"><b>Toolify</b></a><div class="sp"></div><button class="ic" id="tg" title="Toggle theme"></button><button class="ic" id="bell" title="Notifications">${I.bell}</button><div class="avw"><button class="av" id="av" title="Account"><span id="avl">U</span>${I.chev}</button><div class="am" id="am" hidden><button id="gear">${I.gear} Settings</button><button id="out" hidden>Sign out</button></div></div></div></header><div class="wrap"><main id="m"></main><footer>© <span id="copyright-year"></span> Toolify · Made by Mohak Choubey · <a href="${BASE}">Home</a></footer></div></div>
<aside class="dr" id="dr"><div class="row"><b style="flex:1;font-size:1.2rem">Settings</b><button class="ic" id="dx">${I.x}</button></div>
<label>Theme</label><div class="seg" id="sg">${['light','dark','system'].map(v=>`<button data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>
<label>Accent colour</label><div class="sw" id="sw">${['#2563eb','#f59e0b','#10b981','#ef4444','#3b82f6','#ec4899','#14b8a6'].map(c=>`<button data-c="${c}" style="background:${c}"></button>`).join('')}<input type="color" id="ac"></div>
<label>Interface size · <span id="sv"></span></label><input type="range" id="sc" min="80" max="130" step="5">
<button class="btn" id="rs" style="margin-top:.8rem">Reset to defaults</button></aside>
<div class="cm" id="cm" hidden></div><div class="ts" id="ts"></div>`;
document.getElementById('copyright-year').textContent = new Date().getFullYear();
$('#tg').onclick=()=>setCfg({theme:dark()?'light':'dark'});
$('#gear').onclick=e=>{e.stopPropagation();$('#am').hidden=true;$('#dr').classList.toggle('on')};$('#av').onclick=e=>{e.stopPropagation();$('#am').hidden=!$('#am').hidden};$('#bell').onclick=()=>{if('Notification' in window)Notification.requestPermission().then(r=>toast(r=='granted'?'Notifications are on':'Notifications are blocked in this browser'));else toast('Notifications not supported here')};$('#dx').onclick=()=>$('#dr').classList.remove('on');
$('#sg').onclick=e=>{const b=e.target.closest('button');b&&setCfg({theme:b.dataset.v})};
$('#sw').onclick=e=>{const b=e.target.closest('button');b&&setCfg({accent:b.dataset.c})};
$('#ac').oninput=e=>setCfg({accent:e.target.value});$('#sc').oninput=e=>setCfg({scale:+e.target.value});

function syncUI(){if(!$('#dr'))return;$('#tg').innerHTML=dark()?I.sun:I.moon;$('#sg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==cfg.theme));

function showMenu(x,y,items){const m=$('#cm');m.innerHTML=items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'dg':''}" ${it.off?'disabled':''}>${it.l}</button>`).join('');m.hidden=false;
m.style.left=Math.max(8,Math.min(x,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-m.offsetHeight-8))+'px';
m.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)items[b.dataset.i].fn()}}
document.addEventListener('contextmenu',e=>{if(!menuFn||e.target.closest('input,[contenteditable=true]'))return;const it=menuFn(e);if(!it)return;e.preventDefault();showMenu(e.clientX,e.clientY,it)});
['click','scroll','resize','keydown'].forEach(v=>addEventListener(v,e=>{if((v!='keydown'||e.key=='Escape')&&$('#cm'))$('#cm').hidden=true},true));
let lp;addEventListener('touchstart',e=>{if(!menuFn||e.target.closest('input'))return;const t=e.touches[0],tg=e.target;lp=setTimeout(()=>{const it=menuFn({target:tg});if(it)showMenu(t.clientX,t.clientY,it)},650)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(v=>addEventListener(v,()=>clearTimeout(lp),{passive:true}));

function toast(msg){const d=document.createElement('div');d.textContent=msg;$('#ts').append(d);setTimeout(()=>d.remove(),2800)}
function modal(h){const o=document.createElement('div');o.className='md';o.innerHTML=`<div class="glass">${h}</div>`;document.body.append(o);const b=o.firstChild;b.close=()=>o.remove();o.onclick=e=>{if(e.target==o)o.remove()};return b}

/* Local-first store: instant from localStorage, live-synced with Firestore (dayPasser/{uid}/{col}) */
function Store(col,onChange){let items=[];const k=()=>`tf_${col}_${U.uid}`,ref=()=>db.collection(`dayPasser/${U.uid}/${col}`),keep=()=>localStorage[k()]=JSON.stringify(items);
try{items=JSON.parse(localStorage[k()]||'[]')}catch{}
return{get:()=>items,
async put(it){const i=items.findIndex(x=>x.id==it.id);i<0?items.push(it):items[i]=it;keep();onChange(items);if(!db)return;try{await ref().doc(it.id).set(JSON.parse(JSON.stringify(it)))}catch{toast('Saved on this device · cloud sync failed')}},
async del(id){items=items.filter(x=>x.id!=id);keep();onChange(items);if(!db)return;try{await ref().doc(id).delete()}catch{toast('Deleted locally · cloud sync failed')}},
start(){onChange(items);if(!db)return;return ref().onSnapshot(s=>{items=s.docs.map(d=>d.data());keep();onChange(items)},()=>toast('Offline · showing saved data'))}}}

function boot({page,open,menu,start}){
shell(page);menuFn=menu||null;
if(FIREBASE_CONFIG.apiKey=='PASTE'||typeof firebase=='undefined'){U={uid:'local'};const nb=document.createElement('div');nb.className='note';nb.textContent='Local mode — data is saved only in this browser. To sync across devices, fill in firebaseConfig at the top of this file and allow Firebase in your ad-blocker / Brave shields.';$('#m').before(nb);return start(U)}
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
$('#out').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
if(!u){if(open&&open()){$('#out').remove();return start(null)}location.href=LOGIN+'?next='+encodeURIComponent(location.pathname+location.search);return}
U=u;$('#out').hidden=false;$('#avl').textContent=(u.email||'U')[0].toUpperCase();try{const d=await db.doc(`dayPasser/${u.uid}/meta/toolifySettings`).get();if(d.exists){Object.assign(cfg,d.data());apply()}}catch{}
start(u)})}
apply();
return{boot,$,esc,I,toast,modal,Store,showMenu,get U(){return U},get db(){return db}}})();

</script>
<script>
const {$,esc,toast,Store,I}=TF;
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const SAMPLE=[{id:'s1',t:'your kid was born',date:off(-14),e:'👶',m:'ago'},{id:'s2',t:'you bought a house',date:off(-8188),e:'🏠',m:'ago'},
{id:'s3',t:'with your girlfriend',date:off(-41),e:'💞',m:'with'},{id:'s4',t:'your Japan trip',date:off(30),e:'✈️',m:'ago'}];
const EM=['👶','🏠','💞','🎂','🎓','✈️','🏆','🚗','🐶','💍'];
let S,items=[],em='💞',m='ago',first=true;
const utc=s=>{const[y,mo,d]=s.split('-').map(Number);return Date.UTC(y,mo-1,d)};
const diff=s=>{const n=new Date();return Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-utc(s))/864e5)};
function parts(s){const[y,mo,d]=s.split('-').map(Number),n=new Date();let Y=n.getFullYear()-y,M=n.getMonth()+1-mo,D=n.getDate()-d;if(D<0){M--;D+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(M<0){Y--;M+=12}return`${Y}y ${M}m ${D}d`}
function card(e,i){const n=diff(e.date),fut=n<0,a=Math.abs(n),unit=fut?'days to go':e.m=='with'?'days together':'days ago';
const nx=Math.floor(a/100)*100+100,pc=fut?Math.max(0,1-a/365):(a%100)/100;
const ms=fut?`That's ${Math.floor(a/7)} weeks and ${a%7} days away`:a&&a%100==0?'🎉 Milestone day today!':`Day ${nx.toLocaleString()} arrives in ${nx-a} days`;
const dt=new Date(e.date+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
return`<article class="glass card" data-id="${e.id}" style="--i:${i}"><button class="ic x" aria-label="Delete">${I.x}</button><span class="e">${e.e}</span>
<div class="rg"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7" data-o="${(1-pc)*326.7}"/></svg><div class="nm"><b class="num" data-n="${a}">${a.toLocaleString()}</b><small>${unit}</small></div></div>
<h3>${esc(e.t)}</h3><p class="mu">${dt}${fut?'':' · '+parts(e.date)}</p><p class="ms">${ms}</p></article>`}
function render(){const real=items.length>0,all=real?items:SAMPLE;
const v=[...all].sort((a,b)=>b.date.localeCompare(a.date));
$('#gr').innerHTML=(real?'':'<div class="note" style="grid-column:1/-1">Sample moments — add your first one and these disappear.</div>')+v.map(card).join('');
requestAnimationFrame(()=>{document.querySelectorAll('.pg').forEach(c=>c.style.strokeDashoffset=c.dataset.o);
if(first){first=false;document.querySelectorAll('.num').forEach(el=>{const to=+el.dataset.n,t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/1100);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString();if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}})}
function add(){const t=$('#dt').value.trim(),d=$('#dd').value;if(!t||!d)return toast('Add a title and a date');
S.put({id:crypto.randomUUID().slice(0,12),t,date:d,e:em,m,ts:Date.now()});$('#dt').value='';toast('Moment added ✨')}

TF.boot({page:'days',
start:()=>{
$('#m').innerHTML=`<div class="glass pad hero"><h1>Every day, <em>counted</em>.</h1><p class="mu">Track the moments that matter — births, homes, anniversaries, trips. Counts update automatically every day.</p>
<div class="frm"><div class="em" id="em">${EM.map(x=>`<button data-e="${x}" class="${x==em?'on':''}">${x}</button>`).join('')}</div>
<input id="dt" placeholder="e.g. your kid was born / with your girlfriend" maxlength="80" autocomplete="off"><input type="date" id="dd" value="${ymd(new Date())}">
<div class="seg" id="md"><button data-m="ago" class="on">Days ago</button><button data-m="with">Together</button></div><button class="btn pri" id="ad" style="grid-column:1/-1">＋ Add moment</button></div></div><div class="grid" id="gr"></div>`;
$('#ad').onclick=add;$('#dt').onkeydown=e=>e.key=='Enter'&&add();
$('#em').onclick=e=>{const b=e.target.closest('button');if(!b)return;em=b.dataset.e;$('#em').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
$('#md').onclick=e=>{const b=e.target.closest('button');if(!b)return;m=b.dataset.m;$('#md').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
$('#gr').onclick=e=>{const el=e.target.closest('.card'),b=e.target.closest('.x');if(!el||!b||!items.find(x=>x.id==el.dataset.id))return;
if(confirm('Delete this moment?')){el.style.transition='.3s';el.style.opacity=0;el.style.transform='scale(.9)';setTimeout(()=>S.del(el.dataset.id),280)}};
S=Store('memories',v=>{items=v;render()});S.start();
let day=new Date().getDate();setInterval(()=>{const d=new Date().getDate();if(d!=day){day=d;render()}},60000)}});
</script>
<script type="module" src="https://mohakchoubey.github.io/toolify/protect.js"></script>
</body>
</html>
