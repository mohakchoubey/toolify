<style>

<script>
/* Toolify shared core: Firebase, auth gate, theme, settings, context menu, local+cloud store */
const TF=(()=>{

const BASE='./',LOGIN=BASE+'login.html';

const I={bell:P('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'),chev:P('<path d="M6 9l6 6 6-6"/>'),cal:P('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>'),x:P('<path d="M6 6l12 12M18 6L6 18"/>'),gear:P('<path d="M12 3v2.5M12 18.5V21M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M3 12h2.5M18.5 12H21M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"/><circle cx="12" cy="12" r="3.5"/>'),dots:P('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>')};

mq.onchange=apply;
const CSS=`*{box-sizing:border-box;margin:0}html{font-size:calc(16px*var(--s,1));scroll-behavior:smooth}

body{font:400 1rem/1.5 'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}a{color:inherit;text-decoration:none}.wrap{max-width:70rem;margin:0 auto;padding:1rem}.top{padding:.9rem 0 .5rem}.in{max-width:70rem;margin:0 auto;padding:0 1rem}.brand{display:flex;align-items:center;gap:.7rem;font-weight:700;letter-spacing:-.03em}.brand img{width:2.1rem;height:2.1rem;border-radius:.7rem}.bar{display:flex;align-items:center;justify-content:space-between;gap:.8rem}.r{display:flex;align-items:center;gap:.55rem}.ic{width:2.2rem;height:2.2rem;display:grid;place-items:center;border-radius:.7rem;border:1px solid var(--b);background:var(--c);color:var(--tx);cursor:pointer;transition:.2s;font:inherit;flex:none}.ic:hover,.btn:hover,button:hover{transform:translateY(-1px)}.ic svg{width:1.05rem;height:1.05rem}.btn{font:inherit;font-weight:600;padding:.6rem 1rem;border-radius:.8rem;border:1px solid var(--b);background:var(--c);color:var(--tx);cursor:pointer;transition:.2s;display:inline-block}.btn.primary{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 70%,white 30%));border-color:transparent;color:white}.ghost{background:transparent}.pad{padding:1.1rem 1.2rem}.input,.select{font:inherit;color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent);border:1px solid var(--b);border-radius:.75rem;padding:.65rem .8rem;outline:0;min-width:0;transition:.2s}.input:focus,.select:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}.note{padding:.8rem 1rem;border:1px solid var(--b);background:color-mix(in srgb,var(--tx) 4%,transparent);border-radius:.9rem;color:var(--mu)}.dr{position:relative}.drop{position:absolute;right:0;top:calc(100% + .5rem);width:18rem;background:var(--c);border:1px solid var(--b);border-radius:1rem;padding:.7rem;box-shadow:0 20px 60px rgba(0,0,0,.25);display:grid;gap:.7rem;z-index:30}.drop[hidden]{display:none}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}.sw button{width:100%;height:2.2rem;border-radius:.7rem;border:1px solid var(--b);background:transparent;color:var(--tx);cursor:pointer}.sw button.on{background:var(--a);border-color:var(--a);color:white}.dot{display:inline-block;width:1rem;height:1rem;border-radius:50%;vertical-align:middle;border:2px solid rgba(255,255,255,.6)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem}.avatar{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--a);color:white;font-size:.8rem;font-weight:700}.menu{position:fixed;z-index:90;min-width:10rem;background:var(--c);border:1px solid var(--b);border-radius:1rem;padding:.5rem;box-shadow:0 25px 40px rgba(0,0,0,.2);display:grid;gap:.2rem}.menu button{padding:.7rem .8rem;border:none;background:transparent;color:var(--tx);border-radius:.6rem;text-align:left;font:inherit;cursor:pointer}.menu button:hover{background:color-mix(in srgb,var(--tx) 8%,transparent)}.menu .dg{color:#ef4444}.glass{background:var(--c);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--b);border-radius:1rem;box-shadow:var(--sh)}.page{min-height:100vh}.main{max-width:70rem;margin:0 auto;padding:1rem}.ts{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:grid;gap:.4rem;z-index:80}.ts div{padding:.6rem 1.1rem;border-radius:2rem;background:var(--tx);color:var(--bg);font-weight:600}.md{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:1rem;z-index:100}.md>.glass{width:min(33rem,100%);padding:1rem}.meta{margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--b);font-size:.8rem;color:var(--mu)}.m{display:flex;align-items:center;gap:.5rem}.m .dot{width:.6rem;height:.6rem}`;
const CSS2=`
[data-t=light]{--bg:#f6f8fb;--c:#fff;--b:#e6eaf0;--tx:#0f172a;--mu:#64748b;--sh:0 1px 2px rgba(15,23,42,.04),0 12px 30px -20px rgba(15,23,42,.2);color-scheme:light}
[data-t=dark]{--bg:#000;--c:#0e0e10;--b:#26262b;--tx:#f4f4f5;--mu:#9a9aa6;--sh:none;color-scheme:dark}
body{font-family:'Inter',system-ui,sans-serif}.glass{background:var(--c);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--b);border-radius:1rem;box-shadow:var(--sh)}.page{min-height:100vh}.card{animation:up .4s both}.btn.primary{background:linear-gradient(135deg,var(--a),#1d4ed8)}
`;
const st=document.createElement('style');st.textContent=CSS;document.head.append(st);const st2=document.createElement('style');st2.textContent=CSS2;document.head.append(st2);
function shell(page){
document.body.innerHTML=`<div class="page"><header class="top"><div class="in"><div class="bar"><a class="brand" href="${BASE}"><img src="${BASE}favicon.png" alt="" /><span>Toolify</span></a><div class="r"><button id="bell" class="ic" aria-label="Notifications">${I.bell}</button><div class="dr"><button id="av" class="ic" aria-label="Account menu">${I.dots}</button><div id="am" class="drop" hidden><div class="note" style="padding:.5rem .7rem;">Signed in</div><button id="out" class="btn ghost" style="width:100%">Sign out</button></div></div></div></div></div></header><main class="main"><div id="m"></div></main><footer class="meta"><div class="in"><span id="copyright-year"></span> © Toolify</div></footer></div><div id="ts" class="ts"></div><div id="cm" class="menu" hidden></div>`;
document.getElementById('copyright-year').textContent = new Date().getFullYear();
$('#bell').onclick=()=>toast('You are up to date');
$('#av').onclick=e=>{e.stopPropagation();$('#am').hidden=!$('#am').hidden};
document.addEventListener('click',e=>{if(!e.target.closest('#am')&&!e.target.closest('#av'))$('#am').hidden=true});
apply();
}
function showMenu(x,y,items){const m=$('#cm');m.innerHTML=items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'dg':''}" ${it.off?'disabled':''}>${it.l}</button>`).join('');m.hidden=false;m.style.left=x+'px';m.style.top=y+'px';}
document.addEventListener('contextmenu',e=>{if(!menuFn||e.target.closest('input,[contenteditable=true]'))return;const it=menuFn(e);if(!it)return;e.preventDefault();showMenu(e.clientX,e.clientY,it)});
['click','scroll','resize','keydown'].forEach(v=>addEventListener(v,e=>{if((v!='keydown'||e.key=='Escape')&&$('#cm'))$('#cm').hidden=true},true));
let lp;addEventListener('touchstart',e=>{if(!menuFn||e.target.closest('input'))return;const t=e.touches[0],tg=e.target;lp=setTimeout(()=>{const it=menuFn({target:tg});if(it)showMenu(t.clientX,t.clientY,it)},450)});
function toast(msg){const d=document.createElement('div');d.textContent=msg;$('#ts').append(d);setTimeout(()=>d.remove(),2800)}
function modal(h){const o=document.createElement('div');o.className='md';o.innerHTML=`<div class="glass">${h}</div>`;document.body.append(o);const b=o.firstChild;b.close=()=>o.remove();o.onclick=e=>{if(e.target===o)b.close()};return b}
function Store(col,onChange){let items=[];const k=()=>`tf_${col}_${U.uid}`,ref=()=>db.collection(`dayPasser/${U.uid}/${col}`),keep=()=>localStorage[k()]=JSON.stringify(items);try{items=JSON.parse(localStorage[k()]||'[]')}catch{};return{start(){onChange(items);},get:()=>items,async put(it){const i=items.findIndex(x=>x.id==it.id);i<0?items.push(it):items[i]=it;keep();onChange(items);if(!db)return;try{await ref().doc(it.id).set(JSON.parse(JSON.stringify(it)))}catch{}},async remove(id){items=items.filter(x=>x.id!==id);keep();onChange(items);if(!db)return;try{await ref().doc(id).delete()}catch{}},async sync(){if(!db)return;try{const snap=await ref().get();items=snap.docs.map(d=>d.data());keep();onChange(items)}catch{}}}}
function boot({page,open,menu,start}){
shell(page);menuFn=menu||null;
const configValid = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'PASTE' && FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.projectId !== 'PASTE');
if(!configValid || typeof firebase==='undefined'){U={uid:'local'};const nb=document.createElement('div');nb.className='note';nb.textContent='Local mode — data is saved only in this browser.';$('#m').append(nb);if(start)start(null);return {boot,$,esc,I,toast,modal,Store,showMenu,get U(){return U},get db(){return db}};}
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
$('#out').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
if(!u){if(open&&open()){$('#out').remove();return start(null)}location.href=LOGIN+'?next='+encodeURIComponent(location.pathname+location.search);return}
U=u;$('#out').hidden=false;$('#av').textContent=(u.email||'U')[0].toUpperCase();try{const d=await db.doc(`dayPasser/${u.uid}/meta/toolifySettings`).get();if(d.exists){Object.assign(cfg,d.data());apply();}}catch{}
if(start)start(u);
});
return {boot,$,esc,I,toast,modal,Store,showMenu,get U(){return U},get db(){return db}};
}
return {boot,$,esc,I,toast,modal,Store,showMenu,get U(){return U},get db(){return db}};
})();
</script>
<script>
const {$,esc,toast,Store,I}=TF;
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const SAMPLE=[{id:'s1',t:'your kid was born',date:off(-14),e:'👶',m:'ago'},{id:'s2',t:'you bought a house',date:off(-8188),e:'🏠',m:'ago'},{id:'s3',t:'with your girlfriend',date:off(-41),e:'💞',m:'ago'},{id:'s4',t:'your first trip',date:off(-200),e:'✈️',m:'ago'}];
const EM=['👶','🏠','💞','🎂','🎓','✈️','🏆','🚗','🐶','💍'];
let S,items=[],em='💞',m='ago',first=true;
const utc=s=>{const[y,mo,d]=s.split('-').map(Number);return Date.UTC(y,mo-1,d)};
const diff=s=>{const n=new Date();return Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-utc(s))/864e5)};
function parts(s){const[y,mo,d]=s.split('-').map(Number),n=new Date();let Y=n.getFullYear()-y,M=n.getMonth()+1-mo,D=n.getDate()-d;if(D<0){M--;D+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(M<0){Y--;M+=12}return{Y,M,D}};
function card(e,i){const n=diff(e.date),fut=n<0,a=Math.abs(n),unit=fut?'days to go':e.m=='with'?'days together':'days ago';const nx=Math.floor(a/100)*100+100,pc=fut?Math.max(0,1-a/365):(a%100)/100;const ring=100-(pc*100);return `<article class="glass card" data-id="${e.id}" style="--i:${i}"><button class="ic x" aria-label="Delete">${I.x}</button><span class="e">${e.e}</span><div class="rg"><svg viewBox="0 0 120 120"><circle class="bg" r="42" cx="60" cy="60" stroke-width="10"></circle><circle class="fg" r="42" cx="60" cy="60" stroke-dasharray="264" stroke-dashoffset="${ring*2.64}" style="--off:${ring*2.64}"></circle></svg></div><div class="nm"><div><h3>${esc(e.t)}</h3><small>${unit}</small></div><b>${a}</b></div><div class="ms">${unit}</div></article>`;}
function render(){const real=items.length>0,all=real?items:SAMPLE;const v=[...all].sort((a,b)=>b.date.localeCompare(a.date));$('#gr').innerHTML=(real?'':'<div class="note" style="grid-column:1/-1">Sample items are shown until you add your own.</div>')+v.map(card).join('');}
function add(){const t=$('#dt').value.trim(),d=$('#dd').value;if(!t||!d)return toast('Add a title and a date');S.put({id:crypto.randomUUID().slice(0,12),t,date:d,e:em,m,ts:Date.now()});$('#dt').value='';$('#dd').value='';}
TF.boot({page:'days',start:()=>{
$('#m').innerHTML=`<div class="glass pad hero"><h1>Every day, <em>counted</em>.</h1><p class="mu">Track the moments that matter — births, homes, anniversaries, trips. Counts update automatically every day.</p><div class="frm"><input id="dt" class="input" type="text" placeholder="Title" /><input id="dd" class="input" type="date" /><button id="ad" class="btn primary">Add</button><div class="em" id="em">${EM.map(x=>`<button type="button" class="${x===em?'on':''}" data-e="${x}" aria-label="Emoji ${x}">${x}</button>`).join('')}</div><div class="em" id="md">${['ago','with','to go'].map(x=>`<button type="button" class="${x===m?'on':''}" data-m="${x}">${x}</button>`).join('')}</div></div></div><div id="gr" class="grid"></div>`;
$('#ad').onclick=add;$('#dt').onkeydown=e=>e.key=='Enter'&&add();
$('#em').onclick=e=>{const b=e.target.closest('button');if(!b)return;em=b.dataset.e;$('#em').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
$('#md').onclick=e=>{const b=e.target.closest('button');if(!b)return;m=b.dataset.m;$('#md').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
$('#gr').onclick=e=>{const el=e.target.closest('.card'),b=e.target.closest('.x');if(!el||!b||!items.find(x=>x.id==el.dataset.id))return;if(confirm('Delete this moment?')){el.style.transition='.3s';el.style.opacity='0';setTimeout(()=>S.remove(el.dataset.id),260)}};
S=Store('memories',v=>{items=v;render()});S.start();
let day = new Date().getDate();
setInterval(() => {
  const d = new Date().getDate();
  if (d != day) {
    day = d;
    render();
  }
}, 60000);
}});
</script>
