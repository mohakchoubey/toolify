const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const SAMPLE=[{id:'s1',t:'your kid was born',date:off(-14),e:'👶',m:'ago'},{id:'s2',t:'you bought a house',date:off(-8188),e:'🏠',m:'ago'},{id:'s3',t:'with your girlfriend',date:off(-41),e:'💞',m:'with'},{id:'s4',t:'your Japan trip',date:off(30),e:'✈️',m:'ago'}];
const EM=['👶','🏠','💞','🎂','🎓','✈️','🏆','🚗','🐶','💍'];
let S,items=[],em='💞',m='ago',first=true;
const utc=s=>{const[y,mo,d]=s.split('-').map(Number);return Date.UTC(y,mo-1,d)};
const diff=s=>{const n=new Date();return Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-utc(s))/864e5)};
function parts(s){const[y,mo,d]=s.split('-').map(Number),n=new Date();let Y=n.getFullYear()-y,M=n.getMonth()+1-mo,D=n.getDate()-d;if(D<0){M--;D+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(M<0){Y--;M+=12}return `${Y?`${Y}y `:''}${M?`${M}m `:''}${D?`${D}d`:''}`.trim()||'today';}
function card(e,i){const n=diff(e.date),fut=n<0,a=Math.abs(n),unit=fut?'days to go':e.m=='with'?'days together':'days ago';const nx=Math.floor(a/100)*100+100,pc=fut?Math.max(0,1-a/365):(a%100)/100;const ms=fut?`That's ${Math.floor(a/7)} weeks and ${a%7} days away`:a&&a%100==0?'🎉 Milestone day today!':`Day ${nx.toLocaleString()} arrives in ${nx-a} days`;const dt=new Date(e.date+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
return`<article class="glass card" data-id="${e.id}" style="--i:${i}"><button class="ic x" aria-label="Delete">${I.x}</button><span class="e">${e.e}</span><div class="rg"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7" data-o="${(1-pc)*326.7}" /></svg><div class="nm"><b class="num" data-n="${a || 0}">${a}</b><small>${unit}</small></div></div><h3>${esc(e.t)}</h3><p class="mu">${dt}${fut?'':' · '+parts(e.date)}</p><p class="ms">${ms}</p></article>`}
function render(){const real=items.length>0,all=real?items:SAMPLE;const v=[...all].sort((a,b)=>b.date.localeCompare(a.date));$('#gr').innerHTML=(real?'':'<div class="note" style="grid-column:1/-1">Sample moments — add your first one and these disappear.</div>')+v.map(card).join('');requestAnimationFrame(()=>{document.querySelectorAll('.pg').forEach(c=>c.style.strokeDashoffset=c.dataset.o);if(first){first=false;document.querySelectorAll('.num').forEach(el=>{const to=+el.dataset.n,t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/1100);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);})}})}
function add(){const t=$('#dt').value.trim(),d=$('#dd').value;if(!t||!d)return toast('Add a title and a date');S.put({id:crypto.randomUUID().slice(0,12),t,date:d,e:em,m,ts:Date.now()});$('#dt').value='';toast('Moment added ✨')}
TF.boot({page:'days',start:()=>{
$('#m').innerHTML=`<div class="glass pad hero"><h1>Every day, <em>counted</em>.</h1><p class="mu">Track the moments that matter — births, homes, anniversaries, trips. Counts update automatically every day.</p><div class="frm"><div class="em" id="em">${EM.map(x=>`<button data-e="${x}" class="${x==em?'on':''}">${x}</button>`).join('')}</div><input id="dt" placeholder="e.g. your kid was born / with your girlfriend" maxlength="80" autocomplete="off"><input type="date" id="dd" value="${ymd(new Date())}"><div class="seg" id="md"><button data-m="ago" class="on">Days ago</button><button data-m="with">Together</button></div><button class="btn pri" id="ad" style="grid-column:1/-1">＋ Add moment</button></div></div>`;
$('#ad').onclick=add;$('#dt').onkeydown=e=>e.key=='Enter'&&add();
$('#em').onclick=e=>{const b=e.target.closest('button');if(!b)return;em=b.dataset.e;$('#em').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
$('#md').onclick=e=>{const b=e.target.closest('button');if(!b)return;m=b.dataset.m;$('#md').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
$('#gr').onclick=e=>{const el=e.target.closest('.card'),b=e.target.closest('.x');if(!el||!b||!items.find(x=>x.id==el.dataset.id))return;if(confirm('Delete this moment?')){el.style.transition='.3s';el.style.opacity=0;el.style.transform='scale(.9)';setTimeout(()=>S.del(el.dataset.id),280)}};
S=Store('memories',v=>{items=v;render()});S.start();
let day = new Date().getDate();

setInterval(() => {
    const d = new Date().getDate();
    if (d != day) {
        day = d;
        render();
    }
}, 60000);

</script>
</body>
</html>
