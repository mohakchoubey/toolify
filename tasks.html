apply()}
function syncUI(){if(!$('#dr'))return;$('#tg').innerHTML=dark()?I.sun:I.moon;$('#sg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==cfg.theme));
$('#sw').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c==cfg.accent));$('#ac').value=cfg.accent;$('#sc').value=cfg.scale;$('#sv').textContent=cfg.scale+'%'}

function showMenu(x,y,items){const m=$('#cm');m.innerHTML=items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'dg':''}" ${it.off?'disabled':''}>${it.l}</button>`).join('');m.hidden=false;
m.style.left=Math.max(8,Math.min(x,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-m.offsetHeight-8))+'px';
m.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)items[b.dataset.i].fn()}}
document.addEventListener('contextmenu',e=>{if(!menuFn||e.target.closest('input,[contenteditable=true]'))return;const it=menuFn(e);if(!it)return;e.preventDefault();showMenu(e.clientX,e.clientY,it)});
['click','scroll','resize','keydown'].forEach(v=>addEventListener(v,e=>{if((v!='keydown'||e.key=='Escape')&&$('#cm'))$('#cm').hidden=true},true));
let lp;addEventListener('touchstart',e=>{if(!menuFn||e.target.closest('input'))return;const t=e.touches[0],tg=e.target;lp=setTimeout(()=>{const it=menuFn({target:tg});if(it)showMenu(t.clientX,t.clientY,it)},650)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(v=>addEventListener(v,()=>clearTimeout(lp),{passive:true}));

function toast(msg){const d=document.createElement('div');d.textContent=msg;$('#ts').append(d);setTimeout(()=>d.remove(),2800)}
function modal(h){const o=document.createElement('div');o.className='md';o.innerHTML=`<div class="glass">${h}</div>`;document.body.append(o);const b=o.firstChild;b.close=()=>o.remove();o.onclick=e=>{if(e.target==o)o.remove()};return b}

/* Local-first store: instant from localStorage, live-synced with Firestore (dayPasser/{uid}/{col}) */
function Store(col,onChange){let items=[];const k=()=>`tf_${col}_${U.uid}`,ref=()=>db.collection(`dayPasser/${U.uid}/${col}`),keep=()=>localStorage[k()]=JSON.stringify(items);
try{items=JSON.parse(localStorage[k()]||'[]')}catch{}
return{get:()=>items,
async put(it){const i=items.findIndex(x=>x.id==it.id);i<0?items.push(it):items[i]=it;keep();onChange(items);if(!db)return;try{await ref().doc(it.id).set(JSON.parse(JSON.stringify(it)))}catch{toast('Saved on this device · cloud sync failed')}},
async del(id){items=items.filter(x=>x.id!=id);keep();onChange(items);if(!db)return;try{await ref().doc(id).delete()}catch{toast('Deleted locally · cloud sync failed')}},
start(){onChange(items);if(!db)return;return ref().onSnapshot(s=>{items=s.docs.map(d=>d.data());keep();onChange(items)},()=>toast('Offline · showing saved data'))}}}

function boot({page,open,menu,start}){
shell(page);menuFn=menu||null;
if(FIREBASE_CONFIG.apiKey=='PASTE'||typeof firebase=='undefined'){U={uid:'local'};const nb=document.createElement('div');nb.className='note';nb.textContent='Local mode — data is saved only in this browser. To sync across devices, fill in firebaseConfig at the top of this file and allow Firebase in your ad-blocker / Brave shields.';$('#m').before(nb);return start(U)}
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
$('#out').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
if(!u){if(open&&open()){$('#out').remove();return start(null)}location.href=LOGIN+'?next='+encodeURIComponent(location.pathname+location.search);return}
U=u;$('#out').hidden=false;$('#avl').textContent=(u.email||'U')[0].toUpperCase();try{const d=await db.doc(`dayPasser/${u.uid}/meta/toolifySettings`).get();if(d.exists){Object.assign(cfg,d.data());apply()}}catch{}
start(u)})}
apply();
return{boot,$,esc,I,toast,modal,Store,showMenu,get U(){return U},get db(){return db}}})();

</script>
<script>
const {$,esc,toast,Store,I}=TF;
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date()),off=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const nowKey=()=>{const d=new Date();return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const SAMPLE=[{id:'s1',t:'Reply to client emails',due:off(-1),tm:'',p:3,done:false},{id:'s2',t:'Ship the Toolify launch video',due:off(1),tm:'18:00',p:3,done:false},
{id:'s3',t:'Pay the electricity bill',due:off(3),tm:'12:00',p:2,done:false},{id:'s4',t:'Plan next quarter strategy',due:off(5),tm:'09:00',p:2,done:false},
{id:'s5',t:'Design new landing page',due:off(8),tm:'14:00',p:1,done:false},{id:'s6',t:'Morning workout',due:today(),tm:'',p:1,done:true}];
let S,items=[],flt='all',sel=null,cal=new Date(),pr=2,sent=JSON.parse(localStorage.tf_nt||'[]');
const data=()=>items.length?items:SAMPLE;
const late=t=>!t.done&&t.due&&`${t.due}T${t.tm||'23:59'}`<nowKey();
const fd=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const when=t=>t.due?fd(t.due)+(t.tm?' · '+t.tm:''):'No date';
const row=t=>`<div class="t${t.done?' dn':''}" data-id="${t.id}"><button class="chk" aria-label="Toggle complete">${I.check}</button><div class="tx"><b>${esc(t.t)}</b><small class="${late(t)?'od':''}">${late(t)?I.clock:I.cal}${late(t)?'<b>Overdue</b> · ':''}${when(t)}</small></div><button class="dots" aria-label="More">${I.dots}</button></div>`;
function notify(title,body){toast(title+': '+body);if('Notification'in window&&Notification.permission=='granted')new Notification(title,{body,icon:'./favicon.png'})}
function render(){const all=data(),real=items.length>0;let v=all.filter(t=>flt=='all'||(flt=='done')==t.done);if(sel)v=v.filter(t=>t.due==sel);
v.sort((a,b)=>a.done-b.done||(a.due||'9').localeCompare(b.due||'9')||(a.tm||'').localeCompare(b.tm||'')||b.p-a.p);
$('#ls').innerHTML=(real?'':`<div class="note">${I.info}Sample data — add your first task and this preview disappears.</div>`)+(v.length?`<div class="glass tl">${v.map(row).join('')}</div>`:'<p class="empty">Nothing here. Enjoy the calm ✨</p>');
const dn=all.filter(t=>t.done).length,pc=all.length?dn/all.length:0;$('#pc').style.strokeDashoffset=(1-pc)*251.3;$('#pn').textContent=Math.round(pc*100)+'%';$('#pt').textContent=`${dn} of ${all.length} done`;
$('#fa').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f==flt));$('#sd').hidden=!sel;$('#sd').textContent=sel?'Clear '+fd(sel)+' ✕':'';drawCal(all)}
function drawCal(all){const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),td=today();
let h=['S','M','T','W','T','F','S'].map(d=>`<i class="dw">${d}</i>`).join('')+'<i></i>'.repeat(first);
for(let d=1;d<=n;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`,p=all.filter(t=>!t.done&&t.due==k);h+=`<button class="dy${k==td?' td':''}${k==sel?' sl':''}" data-d="${k}">${d}${p.length?`<i class="${k<td?'od':''}"></i>`:''}</button>`}
$('#cg').innerHTML=h;$('#cmn').textContent=cal.toLocaleDateString(undefined,{month:'long',year:'numeric'});
const p=all.filter(t=>!t.done);$('#cs').textContent=`${p.length} pending · ${p.filter(late).length} overdue`;agenda(all)}
function agenda(all){const inc=all.filter(t=>!t.done&&t.due),td=today(),by=(a,b)=>(a.due+(a.tm||'')).localeCompare(b.due+(b.tm||''));
const it=(t,sd)=>`<div class="ai"><span>${esc(t.t)}</span><i>${sd?fd(t.due)+(t.tm?' · '+t.tm:''):t.tm||''}</i></div>`,
sec=(h,a,sd)=>`<h4>${h}</h4>`+(a.length?a.map(t=>it(t,sd)).join(''):'<p class="mu">Nothing pending</p>');
$('#ag').innerHTML=sel?sec(sel==td?'Today':fd(sel),inc.filter(t=>t.due==sel).sort(by)):sec('Today',inc.filter(t=>t.due==td).sort(by))+sec('Upcoming',inc.filter(t=>t.due>td).sort(by).slice(0,5),1)}
function add(){const i=$('#nt'),t=i.value.trim();if(!t)return i.focus();
S.put({id:crypto.randomUUID().slice(0,12),t,due:$('#nd').value,tm:$('#ntm').value,p:pr,done:false,ts:Date.now()});
i.value='';notify('Task added',t);if('Notification'in window&&Notification.permission=='default')Notification.requestPermission();i.focus()}
function remind(){items.forEach(t=>{if(!t.done&&t.due&&`${t.due}T${t.tm||'09:00'}`<=nowKey()&&!sent.includes(t.id)){sent.push(t.id);localStorage.tf_nt=JSON.stringify(sent);notify('Task due',t.t)}})}
function kill(id){const el=document.querySelector(`[data-id="${id}"]`);el?.classList.add('out');setTimeout(()=>S.del(id),250)}
const mItems=id=>{const t=items.find(x=>x.id==id);return[{l:'＋ Add a task',fn:()=>$('#nt').focus()},{l:t?.done?'↺ Mark as pending':'✓ Mark as complete',off:!t,fn:()=>S.put({...t,done:!t.done})},{l:'🗑 Delete task',off:!t,danger:1,fn:()=>kill(id)}]};

TF.boot({page:'tasks',
menu:e=>mItems(e.target.closest?.('[data-id]')?.dataset.id),
start:()=>{
$('#m').innerHTML=`<div class="hd"><h1>Get things done</h1><p>Stay organized, be productive, and achieve your goals.</p></div>
<div class="g"><section><div class="glass cmp"><input id="nt" placeholder="What needs doing?" maxlength="200" autocomplete="off">
<div class="rw"><label class="fld">${I.cal}<input type="date" id="nd" value="${today()}"></label><label class="fld">${I.clock}<input type="time" id="ntm"></label>
<div class="seg pp" id="pp">${[['1','Low'],['2','Medium'],['3','High']].map(([v,l])=>`<button data-p="${v}" class="${v==2?'on':''}">${l}</button>`).join('')}</div><button class="btn pri add" id="ab">${I.plus} Add task</button></div></div>
<div class="fl"><div class="pill" id="fa">${[['all','All'],['todo','Active'],['done','Done']].map(([v,l])=>`<button data-f="${v}">${l}</button>`).join('')}</div><div class="sp"></div><button class="btn" id="sd" hidden></button></div><div id="ls"></div></section>
<aside style="display:grid;gap:1.2rem"><div class="glass rg"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="40"/><circle class="pg" id="pc" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3"/></svg><div><b id="pn">0%</b><p id="pt"></p></div></div>
<div class="glass cal"><div class="ch"><button class="cb" id="cp" aria-label="Previous month">${I.cl}</button><b id="cmn"></b><button class="cb" id="cn" aria-label="Next month">${I.cr}</button></div><div class="cg" id="cg"></div><div class="cs">${I.list}<span id="cs"></span></div></div>
<div class="glass ag" id="ag"></div>
<button class="glass qa" id="qa"><span class="pl">${I.plus}</span><span><b>Add a task</b><small>✓ Mark as complete</small></span>${I.chev}</button></aside></div><button class="fab" id="fab" aria-label="Add task">${I.plus}</button>`;
$('#ab').onclick=add;$('#nt').onkeydown=e=>e.key=='Enter'&&add();$('#qa').onclick=$('#fab').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});$('#nt').focus()};
$('#pp').onclick=e=>{const b=e.target.closest('button');if(!b)return;pr=+b.dataset.p;$('#pp').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
$('#fa').onclick=e=>{const b=e.target.closest('button');if(b){flt=b.dataset.f;render()}};
$('#sd').onclick=()=>{sel=null;render()};
$('#cp').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);render()};$('#cn').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);render()};
$('#cg').onclick=e=>{const b=e.target.closest('.dy');if(b){sel=sel==b.dataset.d?null:b.dataset.d;render()}};
$('#ls').onclick=e=>{const el=e.target.closest('[data-id]');if(!el)return;const id=el.dataset.id,t=items.find(x=>x.id==id);if(!t)return;
if(e.target.closest('.chk'))S.put({...t,done:!t.done});
else if(e.target.closest('.dots')){const r=e.target.closest('.dots').getBoundingClientRect();TF.showMenu(r.right-176,r.bottom+4,mItems(id))}};
S=Store('tasks',v=>{items=v;render()});S.start();remind();setInterval(remind,30000);setInterval(render,60000)}});
</script>
<script type="module" src="https://mohakchoubey.github.io/toolify/protect.js"></script>
</body>
