<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasks · Toolify</title>
<link rel="icon" href="./favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
[hidden]{display:none!important}
.g{display:grid;grid-template-columns:1fr 20rem;gap:1.2rem;align-items:start}
@media(max-width:60rem){.g{grid-template-columns:1fr}}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:.6rem;margin-bottom:.8rem}
.cmp .big{grid-column:1/-1}.cmp input#nt{grid-column:1/-1;font-size:1.1rem;padding:.8rem 1rem}
.pp{display:flex;gap:.4rem}.pp button{padding:.4rem .8rem}
.fl{display:flex;gap:.4rem;margin:1rem 0 .6rem;align-items:center}.fl .sp{flex:1}
.t{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;margin-bottom:.55rem;border-left:4px solid var(--pc);animation:in .35s ease both;transition:.25s}
.t:hover{transform:translateX(3px);border-color:var(--pc)}.t.out{opacity:0;transform:translateX(2rem) scale(.96)}
.t[data-p="1"]{--pc:#10b981}.t[data-p="2"]{--pc:#f59e0b}.t[data-p="3"]{--pc:#ef4444}
@keyframes in{from{opacity:0;transform:translateY(.6rem)}}
.chk{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--mu);background:none;color:#fff;display:grid;place-items:center;cursor:pointer;transition:.25s;flex:none;padding:0}
.chk svg{width:.9rem;stroke-dasharray:24;stroke-dashoffset:24;transition:.3s .1s}.t.dn .chk{background:var(--a);border-color:var(--a);transform:scale(1.1)}.t.dn .chk svg{stroke-dashoffset:0}
.tx{flex:1;min-width:0}.tx b{font-weight:500;overflow-wrap:anywhere;transition:.3s}.t.dn .tx b{text-decoration:line-through;opacity:.45}
.tx small{display:block;color:var(--mu);font-size:.8rem}.tx small.od{color:#ef4444}
.t .x{opacity:0;width:1.9rem;height:1.9rem}.t:hover .x,.t:focus-within .x{opacity:1}@media(hover:none){.t .x{opacity:1}}
.rg{display:flex;align-items:center;gap:1rem}.rg svg{width:4.6rem;transform:rotate(-90deg)}.rg circle{fill:none;stroke-width:7;stroke-linecap:round}.rg .tr{stroke:var(--b)}.rg .pg{stroke:var(--a);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.rg b{font-size:1.8rem;line-height:1}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:.2rem;text-align:center}.dw{font-style:normal;color:var(--mu);font-size:.75rem;padding:.2rem}
.dy{position:relative;aspect-ratio:1;border:0;border-radius:.6rem;background:none;color:var(--tx);font:inherit;font-size:.85rem;cursor:pointer;transition:.2s}.dy:hover{background:color-mix(in srgb,var(--a) 18%,transparent)}
.dy.td{box-shadow:inset 0 0 0 1.5px var(--a)}.dy.sl{background:var(--a);color:#fff}
.dy u{position:absolute;bottom:.15rem;left:0;right:0;display:flex;justify-content:center;gap:2px}.dy s{width:4px;height:4px;border-radius:50%;background:#f59e0b}.dy.sl s{background:#fff}
.ag h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:.9rem 0 .2rem}.ai{display:flex;gap:.5rem;align-items:center;padding:.4rem 0;font-size:.88rem;border-top:1px solid var(--b)}.ai span{overflow-wrap:anywhere}.ai i{font-style:normal;color:var(--mu);font-size:.75rem;margin-left:auto;white-space:nowrap}
</style>
</head>
<body>
<script>
/* Toolify shared core: Firebase, auth gate, theme, settings, context menu, local+cloud store */
const TF=(()=>{
// >>> Paste the SAME firebaseConfig object your login.html uses <<<
const FIREBASE_CONFIG={apiKey:"PASTE",authDomain:"PASTE",projectId:"PASTE",appId:"PASTE"};
const BASE='./',LOGIN=BASE+'login.html';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={gear:'⚙',check:P('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),x:P('<path d="M6 6l12 12M18 6L6 18"/>'),plus:P('<path d="M12 5v14M5 12h14"/>'),
pen:P('<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/>'),share:P('<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/>'),
out:P('<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>'),moon:P('<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>'),
sun:P('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>')};
let U=null,db,auth,cfg={theme:'system',accent:'#8b5cf6',scale:100},menuFn=null;
try{Object.assign(cfg,JSON.parse(localStorage.tf_cfg||'{}'))}catch{}
const mq=matchMedia('(prefers-color-scheme:dark)');
const dark=()=>cfg.theme=='system'?mq.matches:cfg.theme=='dark';
function apply(){const r=document.documentElement;r.dataset.t=dark()?'dark':'light';r.style.setProperty('--a',cfg.accent);r.style.setProperty('--s',cfg.scale/100);localStorage.tf_cfg=JSON.stringify(cfg);syncUI()}
function setCfg(p){Object.assign(cfg,p);apply();if(U)db.doc(`dayPasser/${U.uid}/meta/toolifySettings`).set(cfg).catch(()=>{})}
mq.onchange=apply;

const CSS=`*{box-sizing:border-box;margin:0}html{font-size:calc(16px*var(--s,1));scroll-behavior:smooth}
[data-t=dark]{--bg:#000;--c:#0f0f0f;--b:rgba(255,255,255,.14);--tx:#fff;--mu:#a1a1aa;color-scheme:dark}
[data-t=light]{--bg:#fff;--c:#f6f6f7;--b:rgba(0,0,0,.12);--tx:#000;--mu:#6b6b76;color-scheme:light}
body{font:400 1rem/1.5 'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}.wrap{max-width:72rem;margin:auto;padding:1rem;min-height:100vh;display:flex;flex-direction:column}main{flex:1}
.glass{background:var(--c);border:1px solid var(--b);border-radius:1.1rem;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.pad{padding:1.2rem}
.top{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;position:sticky;top:.6rem;z-index:20;margin-bottom:1.2rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700}.brand img{width:1.8rem;height:1.8rem;border-radius:.5rem}
nav{display:flex;gap:.2rem;margin-left:.5rem}nav a{padding:.35rem .8rem;border-radius:.7rem;color:var(--mu);font-size:.9rem;transition:.2s}nav a:hover{color:var(--tx)}nav a.on{background:color-mix(in srgb,var(--a) 22%,transparent);color:var(--tx)}.sp{flex:1}
.ic{width:2.2rem;height:2.2rem;display:grid;place-items:center;border-radius:.7rem;border:1px solid var(--b);background:var(--c);color:var(--tx);cursor:pointer;transition:.2s;font:inherit;flex:none}.ic:hover{border-color:var(--a);transform:translateY(-1px)}.ic svg{width:1.05rem;height:1.05rem}
.btn{font:inherit;font-weight:600;padding:.6rem 1rem;border-radius:.8rem;border:1px solid var(--b);background:var(--c);color:var(--tx);cursor:pointer;transition:.2s;display:inline-block}.btn:hover{transform:translateY(-1px)}.btn.pri{background:var(--a);border-color:transparent;color:#fff;box-shadow:0 .5rem 1.4rem -.5rem var(--a)}
input,select{font:inherit;color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent);border:1px solid var(--b);border-radius:.75rem;padding:.6rem .8rem;outline:0;min-width:0;transition:.2s}input:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}
input[type=color]{padding:.15rem;width:2.4rem;height:2.1rem;cursor:pointer}input[type=range]{padding:0;accent-color:var(--a);width:100%}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:2rem 0 1rem}footer a{text-decoration:underline}
.mu{color:var(--mu);font-size:.9rem}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.empty{text-align:center;color:var(--mu);padding:2rem}
.note{padding:.6rem .9rem;border-radius:.8rem;background:color-mix(in srgb,#f59e0b 16%,transparent);border:1px dashed #f59e0b;font-size:.88rem;margin-bottom:.8rem}
.seg{display:flex;gap:.3rem;padding:.25rem;border:1px solid var(--b);border-radius:.9rem}.seg button{flex:1;font:inherit;padding:.4rem .6rem;border:0;border-radius:.65rem;background:none;color:var(--mu);cursor:pointer;transition:.2s}.seg button.on{background:var(--a);color:#fff}
.dr{position:fixed;top:0;right:0;height:100%;width:min(22rem,92vw);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:50;padding:1.2rem;background:var(--bg);border-left:1px solid var(--b);display:flex;flex-direction:column;gap:.7rem;box-shadow:-2rem 0 4rem rgba(0,0,0,.25)}.dr.on{transform:none}.dr label{font-size:.8rem;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-top:.5rem}
.sw{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}.sw button{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s}.sw button.on{border-color:var(--tx);transform:scale(1.15)}
.cm{position:fixed;z-index:70;min-width:12rem;padding:.35rem;background:var(--bg);border:1px solid var(--b);border-radius:.9rem;box-shadow:0 1.5rem 3rem -.5rem rgba(0,0,0,.4);animation:pop .15s ease}.cm[hidden]{display:none}.cm button{display:block;width:100%;text-align:left;font:inherit;padding:.5rem .8rem;border:0;border-radius:.6rem;background:none;color:var(--tx);cursor:pointer}.cm button:hover:not(:disabled){background:color-mix(in srgb,var(--a) 20%,transparent)}.cm button:disabled{opacity:.4;cursor:default}.cm .dg{color:#ef4444}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.ts{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:grid;gap:.4rem;z-index:80}.ts div{padding:.6rem 1.1rem;border-radius:2rem;background:var(--tx);color:var(--bg);font-weight:600;font-size:.9rem;animation:pop .25s ease}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:60;padding:1rem}.md>div{width:min(28rem,100%);padding:1.4rem;display:grid;gap:.8rem;background:var(--bg)}
@media(max-width:640px){.brand b{display:none}nav a{padding:.3rem .55rem}.wrap{padding:.6rem}}`;
const st=document.createElement('style');st.textContent=CSS;document.head.append(st);

function shell(page){
document.body.innerHTML=`<div class="wrap"><header class="glass top"><a class="brand" href="${BASE}"><img src="${BASE}favicon.png" alt="" onerror="this.remove()"><b>Toolify</b></a><div class="sp"></div><button class="ic" id="tg" title="Toggle theme"></button><button class="ic" id="gear" title="Settings">${I.gear}</button><button class="ic" id="out" title="Sign out" hidden>${I.out}</button></header><main id="m"></main><footer>© <span id="copyright-year"></span> Toolify · Made by Mohak Choubey · <a href="${BASE}">Home</a></footer></div>
<aside class="dr" id="dr"><div class="row"><b style="flex:1;font-size:1.2rem">Settings</b><button class="ic" id="dx">${I.x}</button></div>
<label>Theme</label><div class="seg" id="sg">${['light','dark','system'].map(v=>`<button data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>
<label>Accent colour</label><div class="sw" id="sw">${['#8b5cf6','#f59e0b','#10b981','#ef4444','#3b82f6','#ec4899','#14b8a6'].map(c=>`<button data-c="${c}" style="background:${c}"></button>`).join('')}<input type="color" id="ac"></div>
<label>Interface size · <span id="sv"></span></label><input type="range" id="sc" min="80" max="130" step="5">
<button class="btn" id="rs" style="margin-top:.8rem">Reset to defaults</button></aside>
<div class="cm" id="cm" hidden></div><div class="ts" id="ts"></div>`;
document.getElementById('copyright-year').textContent = new Date().getFullYear();
$('#tg').onclick=()=>setCfg({theme:dark()?'light':'dark'});
$('#gear').onclick=e=>{e.stopPropagation();$('#dr').classList.toggle('on')};$('#dx').onclick=()=>$('#dr').classList.remove('on');
$('#sg').onclick=e=>{const b=e.target.closest('button');b&&setCfg({theme:b.dataset.v})};
$('#sw').onclick=e=>{const b=e.target.closest('button');b&&setCfg({accent:b.dataset.c})};
$('#ac').oninput=e=>setCfg({accent:e.target.value});$('#sc').oninput=e=>setCfg({scale:+e.target.value});
$('#rs').onclick=()=>setCfg({theme:'system',accent:'#8b5cf6',scale:100});
document.addEventListener('click',e=>{if(!e.target.closest('#dr'))$('#dr').classList.remove('on')});
apply()}
function syncUI(){if(!$('#dr'))return;$('#tg').innerHTML=dark()?I.sun:I.moon;$('#sg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==cfg.theme));
$('#sw').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c==cfg.accent));$('#ac').value=cfg.accent;$('#sc').value=cfg.scale;$('#sv').textContent=cfg.scale+'%'}

function showMenu(x,y,items){const m=$('#cm');m.innerHTML=items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'dg':''}" ${it.off?'disabled':''}>${it.l}</button>`).join('');m.hidden=false;
m.style.left=Math.max(8,Math.min(x,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-m.offsetHeight-8))+'px';
m.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)items[b.dataset.i].fn()}}
document.addEventListener('contextmenu',e=>{if(!menuFn||e.target.closest('input,[contenteditable=true]'))return;const it=menuFn(e);if(!it)return;e.preventDefault();showMenu(e.clientX,e.clientY,it)});
['click','scroll','resize','keydown'].forEach(v=>addEventListener(v,e=>{if((v!='keydown'||e.key=='Escape')&&$('#cm'))$('#cm').hidden=true},true));
let lp;addEventListener('touchstart',e=>{if(!menuFn||e.target.closest('input'))return;const t=e.touches[0],tg=e.target;lp=setTimeout(()=>{const it=menuFn({target:tg});if(it)showMenu(t.clientX,t.clientY,it)},650)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(v=>addEventListener(v,()=>clearTimeout(lp),{passive:true}));

function toast(msg){const d=document.createElement('div');d.textContent=msg;$('#ts').append(d);setTimeout(()=>d.remove(),2800)}
function modal(h){const o=document.createElement('div');o.className='md';o.innerHTML=`<div class="glass">${h}</div>`;document.body.append(o);const b=o.firstChild;b.close=()=>o.remove();o.onclick=e=>{if(e.target==o)o.remove()};return b}

/* Local-first store: instant from localStorage, live-synced with Firestore (dayPasser/{uid}/{col}) */
function Store(col,onChange){let items=[];const k=()=>`tf_${col}_${U.uid}`,ref=()=>db.collection(`dayPasser/${U.uid}/${col}`),keep=()=>localStorage[k()]=JSON.stringify(items);
try{items=JSON.parse(localStorage[k()]||'[]')}catch{}
return{get:()=>items,
async put(it){const i=items.findIndex(x=>x.id==it.id);i<0?items.push(it):items[i]=it;keep();onChange(items);try{await ref().doc(it.id).set(JSON.parse(JSON.stringify(it)))}catch{toast('Saved on this device · cloud sync failed')}},
async del(id){items=items.filter(x=>x.id!=id);keep();onChange(items);try{await ref().doc(id).delete()}catch{toast('Deleted locally · cloud sync failed')}},
start(){onChange(items);return ref().onSnapshot(s=>{items=s.docs.map(d=>d.data());keep();onChange(items)},()=>toast('Offline · showing saved data'))}}}

function boot({page,open,menu,start}){
shell(page);menuFn=menu||null;
if(FIREBASE_CONFIG.apiKey=='PASTE'){$('#m').innerHTML='<div class="glass pad"><b>Firebase config missing</b><p class="mu">Search this file for PASTE and fill in the same firebaseConfig your login.html uses.</p></div>';return}
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
$('#out').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
if(!u){if(open&&open()){$('#out').remove();return start(null)}location.href=LOGIN+'?next='+encodeURIComponent(location.pathname+location.search);return}
U=u;$('#out').hidden=false;try{const d=await db.doc(`dayPasser/${u.uid}/meta/toolifySettings`).get();if(d.exists){Object.assign(cfg,d.data());apply()}}catch{}
start(u)})}
apply();
return{boot,$,esc,I,toast,modal,Store,get U(){return U},get db(){return db}}})();

</script>
<script>
const {$,esc,toast,Store,I}=TF;
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date()),off=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const nowKey=()=>{const d=new Date();return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const SAMPLE=[{id:'s1',t:'Ship the Toolify launch video',due:off(1),tm:'18:00',p:3,done:false},{id:'s2',t:'Pay the electricity bill',due:off(3),tm:'',p:2,done:false},
{id:'s3',t:'Morning workout',due:today(),tm:'',p:1,done:true},{id:'s4',t:'Reply to client emails',due:off(-1),tm:'',p:3,done:false}];
let S,items=[],flt='all',sel=null,cal=new Date(),pr=2,sent=JSON.parse(localStorage.tf_nt||'[]');
const data=()=>items.length?items:SAMPLE;
const late=t=>!t.done&&t.due&&`${t.due}T${t.tm||'23:59'}`<nowKey();
const when=t=>t.due?new Date(t.due+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+(t.tm?' · '+t.tm:''):'No date';
const row=t=>`<div class="glass t${t.done?' dn':''}" data-id="${t.id}" data-p="${t.p}"><button class="chk" aria-label="Toggle complete">${I.check}</button><div class="tx"><b>${esc(t.t)}</b><small class="${late(t)?'od':''}">${late(t)?'Overdue · ':''}${when(t)}</small></div><button class="ic x" aria-label="Delete">${I.x}</button></div>`;
function notify(title,body){toast(title+': '+body);if('Notification'in window&&Notification.permission=='granted')new Notification(title,{body,icon:"./favicon.png"})}
function render(){const all=data(),real=items.length>0;let v=all.filter(t=>flt=='all'||(flt=='done')==t.done);if(sel)v=v.filter(t=>t.due==sel);
v.sort((a,b)=>a.done-b.done||(a.due||'9').localeCompare(b.due||'9')||b.p-a.p);
$('#ls').innerHTML=(real?'':'<div class="note">Sample data — add your first task and this preview disappears.</div>')+(v.map(row).join('')||'<p class="empty">Nothing here. Enjoy the calm ✨</p>');
const dn=all.filter(t=>t.done).length,pc=all.length?dn/all.length:0;$('#pc').style.strokeDashoffset=(1-pc)*326.7;$('#pn').textContent=Math.round(pc*100)+'%';$('#pt').textContent=`${dn} of ${all.length} done`;
$('#fa').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f==flt));$('#sd').hidden=!sel;$('#sd').textContent=sel?'Clear '+sel+' ✕':'';drawCal(all)}
function drawCal(all){const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
let h=['S','M','T','W','T','F','S'].map(d=>`<i class="dw">${d}</i>`).join('')+'<i></i>'.repeat(first);
for(let d=1;d<=n;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`,c=all.filter(t=>!t.done&&t.due==k).length;h+=`<button class="dy${k==today()?' td':''}${k==sel?' sl':''}" data-d="${k}">${d}${c?`<u>${'<s></s>'.repeat(Math.min(c,3))}</u>`:''}</button>`}
$('#cg').innerHTML=h;$('#cmn').textContent=cal.toLocaleDateString(undefined,{month:'long',year:'numeric'});const p=all.filter(t=>!t.done);$('#cs').textContent=`${p.length} pending · ${p.filter(late).length} overdue`;agenda(all)}
function agenda(all){const inc=all.filter(t=>!t.done&&t.due),td=today(),ds=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
const it=(t,sd)=>`<div class="ai"><span>${esc(t.t)}</span><i>${sd?ds(t.due)+(t.tm?' · '+t.tm:''):t.tm||''}</i></div>`,
sec=(h,a,sd)=>`<h4>${h}</h4>`+(a.length?a.map(t=>it(t,sd)).join(''):'<p class="mu" style="font-size:.85rem">Nothing pending</p>'),
by=(a,b)=>(a.due+(a.tm||'')).localeCompare(b.due+(b.tm||''));
$('#ag').innerHTML=sel?sec(new Date(sel+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'}),inc.filter(t=>t.due==sel).sort(by)):sec('Today',inc.filter(t=>t.due==td).sort(by))+sec('Upcoming',inc.filter(t=>t.due>td).sort(by).slice(0,5),1)}
function add(){const i=$('#nt'),t=i.value.trim();if(!t)return i.focus();
S.put({id:crypto.randomUUID().slice(0,12),t,due:$('#nd').value,tm:$('#ntm').value,p:pr,done:false,ts:Date.now()});
i.value='';notify('Task added',t);if('Notification'in window&&Notification.permission=='default')Notification.requestPermission();i.focus()}
function remind(){items.forEach(t=>{if(!t.done&&t.due&&`${t.due}T${t.tm||'09:00'}`<=nowKey()&&!sent.includes(t.id)){sent.push(t.id);localStorage.tf_nt=JSON.stringify(sent);notify('Task due',t.t)}})}
function kill(id){const el=document.querySelector(`[data-id="${id}"]`);el?.classList.add('out');setTimeout(()=>S.del(id),250)}

TF.boot({page:'tasks',
menu:e=>{const id=e.target.closest?.('[data-id]')?.dataset.id,t=items.find(x=>x.id==id);
return[{l:'＋ Add a task',fn:()=>$('#nt').focus()},{l:t?.done?'↺ Mark as pending':'✓ Mark as complete',off:!t,fn:()=>S.put({...t,done:!t.done})},{l:'🗑 Delete task',off:!t,danger:1,fn:()=>kill(id)}]},
start:()=>{
$('#m').innerHTML=`<div class="g"><section><div class="glass pad cmp"><input id="nt" placeholder="What needs doing?" maxlength="200" autocomplete="off"><input type="date" id="nd" value="${today()}"><input type="time" id="ntm"><div class="pp seg" id="pp">${[['1','Low'],['2','Medium'],['3','High']].map(([v,l])=>`<button data-p="${v}" class="${v==2?'on':''}">${l}</button>`).join('')}</div><button class="btn pri big" id="ab">＋ Add task</button></div>
<div class="fl"><div class="seg" id="fa">${[['all','All'],['todo','Active'],['done','Done']].map(([v,l])=>`<button data-f="${v}">${l}</button>`).join('')}</div><div class="sp"></div><button class="btn" id="sd" hidden></button></div><div id="ls"></div></section>
<aside style="display:grid;gap:1.2rem"><div class="glass pad rg"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" id="pc" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><div><b id="pn">0%</b><p class="mu" id="pt"></p></div></div>
<div class="glass pad"><div class="ch"><button class="ic" id="cp">‹</button><b id="cmn"></b><button class="ic" id="cn">›</button></div><div class="cg" id="cg"></div><p class="mu" id="cs" style="margin-top:.7rem;text-align:center"></p><div class="ag" id="ag"></div></div></aside></div>`;
$('#ab').onclick=add;$('#nt').onkeydown=e=>e.key=='Enter'&&add();
$('#pp').onclick=e=>{const b=e.target.closest('button');if(!b)return;pr=+b.dataset.p;$('#pp').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))};
$('#fa').onclick=e=>{const b=e.target.closest('button');if(b){flt=b.dataset.f=='todo'?'todo':b.dataset.f;render()}};
$('#sd').onclick=()=>{sel=null;render()};
$('#cp').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);render()};$('#cn').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);render()};
$('#cg').onclick=e=>{const b=e.target.closest('.dy');if(b){sel=sel==b.dataset.d?null:b.dataset.d;render()}};
$('#ls').onclick=e=>{const el=e.target.closest('[data-id]');if(!el||!items.find(x=>x.id==el.dataset.id))return;const id=el.dataset.id;
if(e.target.closest('.chk')){const t=items.find(x=>x.id==id);S.put({...t,done:!t.done})}else if(e.target.closest('.x'))kill(id)};
S=Store('tasks',v=>{items=v;render()});S.start();remind();setInterval(remind,30000);setInterval(render,60000)}});
</script>
<script type="module" src="https://mohakchoubey.github.io/toolify/protect.js"></script>
</body>
