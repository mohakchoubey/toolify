['touchend','touchmove','touchcancel'].forEach(v=>addEventListener(v,()=>clearTimeout(lp),{passive:true}));

function toast(msg){const d=document.createElement('div');d.textContent=msg;$('#ts').append(d);setTimeout(()=>d.remove(),2800)}
function modal(h){const o=document.createElement('div');o.className='md';o.innerHTML=`<div class="glass">${h}</div>`;document.body.append(o);const b=o.firstChild;b.close=()=>o.remove();o.onclick=e=>{if(e.target==o)o.remove()};return b}

/* Local-first store: instant from localStorage, live-synced with Firestore (dayPasser/{uid}/{col}) */
function Store(col,onChange){let items=[];const k=()=>`tf_${col}_${U.uid}`,ref=()=>db.collection(`dayPasser/${U.uid}/${col}`),keep=()=>localStorage[k()]=JSON.stringify(items);
try{items=JSON.parse(localStorage[k()]||'[]')}catch{}
return{get:()=>items,
async put(it){const i=items.findIndex(x=>x.id==it.id);i<0?items.push(it):items[i]=it;keep();onChange(items);if(!db)return;try{await ref().doc(it.id).set(JSON.parse(JSON.stringify(it)))}catch{toast('Saved on this device · cloud sync failed')}},
async del(id){items=items.filter(x=>x.id!=id);keep();onChange(items);if(!db)return;try{await ref().doc(id).delete()}catch{toast('Deleted locally · cloud sync failed')}},
start(){onChange(items);if(!db)return;return ref().onSnapshot(s=>{items=s.docs.map(d=>d.data());keep();onChange(items)},()=>toast('Offline · showing saved data'))}}}

function boot({page,open,menu,start}){
shell(page);menuFn=menu||null;
if(FIREBASE_CONFIG.apiKey=='PASTE'||typeof firebase=='undefined'){U={uid:'local'};const nb=document.createElement('div');nb.className='note';nb.textContent='Local mode — data is saved only in this browser. To sync across devices, fill in firebaseConfig at the top of this file and allow Firebase in your ad-blocker / Brave shields.';$('#m').before(nb);return start(U)}
firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
$('#out').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
if(!u){if(open&&open()){$('#out').remove();return start(null)}location.href=LOGIN+'?next='+encodeURIComponent(location.pathname+location.search);return}
U=u;$('#out').hidden=false;$('#avl').textContent=(u.email||'U')[0].toUpperCase();try{const d=await db.doc(`dayPasser/${u.uid}/meta/toolifySettings`).get();if(d.exists){Object.assign(cfg,d.data());apply()}}catch{}
start(u)})}
apply();
return{boot,$,esc,I,toast,modal,Store,showMenu,get U(){return U},get db(){return db}}})();

</script>
<script>
const {$,esc,toast,Store,I,modal}=TF;
const qid=new URLSearchParams(location.search).get('id');
const SAMPLE=[{id:'sample',name:'Weekend Groceries',items:[{id:'a',t:'Oat milk',d:1},{id:'b',t:'Sourdough bread',d:0},{id:'c',t:'Cherry tomatoes',d:0},{id:'d',t:'Dark chocolate',d:1}]}];
let S,L=[],cur=null;
const real=()=>L.length>0,data=()=>real()?L:SAMPLE,act=()=>data().find(l=>l.id==cur)||data()[0];
const uid=()=>crypto.randomUUID().slice(0,12);
const li=(i,ro)=>`<li data-id="${i.id}" class="${i.d?'dn':''}"><button class="ck" ${ro?'disabled':''} aria-label="Tick">${I.check}</button><span class="tx">${esc(i.t)}</span>${ro?'':`<button class="ic pe" aria-label="Edit">${I.pen}</button><button class="ic px" aria-label="Delete">${I.x}</button>`}</li>`;
const paper=(l,ro)=>`<article class="paper" data-l="${l.id}"><div class="ptop">${ro?'':`<button class="ic" id="sh" title="Share">${I.share}</button>`}</div><h2 id="ph" ${ro?'':'contenteditable="true" spellcheck="false"'}>${esc(l.name)}</h2><p class="pm">${l.items.filter(i=>i.d).length} of ${l.items.length} done</p><ul class="ruled" id="pi">${l.items.map(i=>li(i,ro)).join('')}${ro?'':'<li class="addr"><input id="pn" placeholder="Write something down…" maxlength="120" autocomplete="off"></li>'}</ul></article>`;
const save=l=>{l.ts=Date.now();S.put(l);if(l.shared)pub(l)};
const pub=l=>TF.db.doc('toolifyShared/'+l.id).set({ownerUid:TF.U.uid,name:l.name,items:l.items,ts:l.ts}).catch(()=>toast('Could not update shared copy'));
function pencil(el,mode){const p=document.createElement('div');p.className='pen';p.innerHTML=I.pen;el.append(p);el.classList.add(mode);setTimeout(()=>{p.remove();el.classList.remove(mode)},900)}
function render(){if(qid)return;const f=document.activeElement?.id=='pn',l=act(),ro=!real();
$('#rail').innerHTML=data().map(x=>`<button class="rl${x.id==l.id?' on':''}" data-l="${x.id}">${esc(x.name)}<span>${x.items.filter(i=>i.d).length}/${x.items.length}</span></button>`).join('');
$('#pp').innerHTML=(ro?'<div class="note">Sample list — create your first list and this preview disappears.</div>':'')+paper(l,ro);
if(f)$('#pn').focus();wire()}
function wire(){const ph=$('#ph'),pn=$('#pn');if(ph&&ph.isContentEditable){ph.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();ph.blur()}};ph.onblur=()=>{const l=act(),n=ph.textContent.trim()||'Untitled list';if(n!=l.name){l.name=n;save(l)}}}
if(pn)pn.onkeydown=e=>{const t=pn.value.trim();if(e.key!='Enter'||!t)return;const l=act(),i={id:uid(),t,d:0};l.items.push(i);save(l);render();const el=document.querySelector(`[data-id="${i.id}"]`);el&&pencil(el,'ink')};
const sh=$('#sh');if(sh)sh.onclick=()=>share(act())}
function share(l){if(!TF.db)return toast('Sign in (Firebase config needed) to share lists');l.shared=true;save(l);const url=`https://mohakchoubey.github.io/toolify/list.html?id=${l.id}&utm_source=share`;
const m=modal(`<h3>Share “${esc(l.name)}”</h3><p class="mu">Anyone with this link can view the list (read-only). Your edits appear on the shared copy automatically.</p><input readonly id="su" value="${url}"><div class="row"><button class="btn pri" id="cp">Copy link</button><button class="btn" id="ns">Stop sharing</button></div>`);
m.querySelector('#su').onclick=e=>e.target.select();
m.querySelector('#cp').onclick=()=>navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>{m.querySelector('#su').select();toast('Press Ctrl+C to copy')});
m.querySelector('#ns').onclick=()=>{l.shared=false;S.put(l);TF.db.doc('toolifyShared/'+l.id).delete().catch(()=>{});m.close();toast('Sharing stopped')}}
function newList(){const l={id:uid(),name:'Untitled list',items:[],ts:Date.now()};cur=l.id;S.put(l);render();const h=$('#ph');h.focus();getSelection().selectAllChildren(h)}
function delList(id){const l=L.find(x=>x.id==id);if(!l||!confirm(`Delete “${l.name}”?`))return;if(l.shared)TF.db.doc('toolifyShared/'+id).delete().catch(()=>{});cur=null;S.del(id);toast('List deleted')}
async function view(){$('#m').innerHTML='<p class="empty">Loading list…</p>';
try{const d=await TF.db.doc('toolifyShared/'+qid).get();if(!d.exists)throw 0;const l=d.data();document.title=l.name+' · Toolify';
$('#m').innerHTML=`<div class="vw"><p class="mu" style="text-align:center">Shared list · read-only</p>${paper({id:qid,name:l.name,items:l.items},true)}<p class="cta"><a class="btn pri" href="./list.html">Make your own lists on Toolify</a></p></div>`}
catch{$('#m').innerHTML='<div class="glass pad empty">This list isn’t available — the owner may have stopped sharing it.</div>'}}

TF.boot({page:'list',open:()=>!!qid,
menu:e=>{if(qid)return null;const id=e.target.closest?.('[data-l]')?.dataset.l||cur,l=L.find(x=>x.id==id);
return[{l:'＋ Add a list',fn:newList},{l:'✎ Edit list name',off:!l,fn:()=>{cur=l.id;render();const h=$('#ph');h.focus();getSelection().selectAllChildren(h)}},{l:'🗑 Delete list',off:!l,danger:1,fn:()=>delList(l.id)}]},
start:()=>{if(qid)return view();
$('#m').innerHTML=`<div class="lg"><aside><div class="rail" id="rail"></div><button class="btn pri" id="nl" style="width:100%;margin-top:.7rem">＋ New list</button></aside><section id="pp"></section></div>`;
$('#nl').onclick=newList;
$('#rail').onclick=e=>{const b=e.target.closest('.rl');if(b){cur=b.dataset.l;render()}};
$('#pp').onclick=e=>{if(!real())return;const el=e.target.closest('#pi>li[data-id]');if(!el)return;const l=act(),it=l.items.find(x=>x.id==el.dataset.id);if(!it)return;
if(e.target.closest('.ck')){it.d=it.d?0:1;save(l);render()}
else if(e.target.closest('.px')){pencil(el,'strike');setTimeout(()=>{el.classList.add('gone');setTimeout(()=>{l.items=l.items.filter(x=>x.id!=it.id);save(l);render()},350)},800)}
else if(e.target.closest('.pe')){const tx=el.querySelector('.tx');tx.contentEditable=true;tx.focus();getSelection().selectAllChildren(tx);
const done=()=>{tx.contentEditable=false;const v=tx.textContent.trim();if(v&&v!=it.t){it.t=v;save(l)}render()};tx.onblur=done;tx.onkeydown=k=>{if(k.key=='Enter'){k.preventDefault();tx.blur()}}}};
S=Store('lists',v=>{L=v.sort((a,b)=>(a.ts||0)-(b.ts||0));if(!L.find(x=>x.id==cur))cur=L[0]?.id||null;render()});S.start()}});
</script>
<script type="module" src="https://mohakchoubey.github.io/toolify/protect.js"></script>
</body>
</html>
